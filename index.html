// ---- Upcoming tab: lines for the next 7 days per sport (lines only, no model picks), from <sport>_upcoming.json ----
let upcomingSport = null;      // set on first open (last choice, else the sport you were viewing)
const upcomingCache = {};      // sport key -> parsed file, or null when it could not be loaded
let upcomingGames = [];         // Games-style objects for the cards on screen, by index (the model dropdown reads these)
let upcomingDate = "all";      // "all" or an ET calendar day (YYYY-MM-DD); reset when the sport changes

function selectUpcoming() {
  currentView = "upcoming";
  if (!upcomingSport) {
    let saved = null;
    try { saved = localStorage.getItem("wagrx-upcoming-sport"); } catch (e) {}
    upcomingSport = SPORTS.some(x => x.key === saved) ? saved : currentSport;
  }
  renderTabs();
  setViewVisibility();
  loadUpcoming();
}

function selectUpcomingSport(key) {
  upcomingSport = key;
  upcomingDate = "all";
  try { localStorage.setItem("wagrx-upcoming-sport", key); } catch (e) {}
  loadUpcoming();
}

function etLabel(iso, opts) {
  const d = new Date(iso);
  return isNaN(d) ? "" : d.toLocaleString("en-US", { ...opts, timeZone: "America/New_York" });
}

// ET calendar day (YYYY-MM-DD), the same clock the kickoff times use.
function etDay(iso) {
  const d = new Date(iso);
  return isNaN(d) ? "" : d.toLocaleDateString("en-CA", { timeZone: "America/New_York" });
}

// The current line as the spread text the Games card expects ("<favorite> -2.5"), with its favorite label.
// home/away are the MODEL's team names: the line data uses ESPN's short names ("Kennesaw State") while the
// picks use the longer ones ("Kennesaw State Owls"), and the card matches the favorite against the picks.
function upcomingSpread(g, home, away) {
  const cur = g.current_home;
  if (cur === null || cur === undefined) return { spread: "N/A", favorite: "?" };
  if (cur === 0) return { spread: "PK", favorite: "?" };
  const fav = cur < 0 ? home : away;
  return { spread: `${fav} -${Math.abs(cur)}`, favorite: `${fav} -fav` };
}

// An Upcoming entry with model picks, shaped like a Games-tab game so renderGame can draw it.
// The line fields come from the live entry (refreshed every cycle); the picks are from the last full run.
function upcomingAsGame(g, keyNumbers) {
  const m = g.model;
  const { spread, favorite } = upcomingSpread(g, m.team_home, m.team_away);
  const hasLine = g.current_home !== null && g.current_home !== undefined;
  // The side the line moved toward, as the MODEL's team name so it can be compared with the consensus pick.
  // Matched by side (home/away), never by comparing name strings across the two sources.
  const side = g.toward_side || (g.toward === g.team_home ? "home" : g.toward === g.team_away ? "away" : null);
  const toward = side === "home" ? m.team_home : side === "away" ? m.team_away : null;
  return {
    game: m.game, spread, favorite, confidence: m.confidence,
    picks: { ...m.picks, [LINE_MOVE_KEY]: toward ? `TAKE: ${toward}` : (hasLine ? "PUSH" : "N/A") },
    detail: { ...m.detail, [LINE_MOVE_KEY]: hasLine ? { open_home: g.open_home, current_home: g.current_home } : null },
    team_home: m.team_home, team_away: m.team_away, start: g.start, sharp_books: m.sharp_books, keyNumbers,
  };
}

function renderUpcomingGame(g, keyNumbers, idx) {
  if (g.model) {
    const game = upcomingAsGame(g, keyNumbers);
    upcomingGames[idx] = game;
    return renderGame(game, idx, null, "upcoming");
  }
  // Lines only: no model picks for this game (yet).
  const cur = g.current_home;
  const hasLine = cur !== null && cur !== undefined;
  const fav = !hasLine ? "not posted yet" : cur === 0 ? "PK" : cur < 0 ? `${g.team_home} ${cur}` : `${g.team_away} ${-cur}`;
  const time = etLabel(g.start, { hour: "numeric", minute: "2-digit" });
  const dayPrefix = upcomingFilters.sort === "start" ? "" : etLabel(g.start, { weekday: "short", month: "short", day: "numeric" }) + ", ";
  return `
    <div class="game-card static">
      <div class="game-header">
        <div class="game-title">${g.game}</div>
        <div class="game-meta">${dayPrefix}${time} ET &middot; Line: ${fav}</div>
        ${hasLine ? lineMoveBlock({ home: g.team_home, open: g.open_home, cur, toward: g.toward, keyNumbers }) : ""}
      </div>
    </div>`;
}

// Upcoming filters (separate from the Games/History set above; same look). Move size = |now - open| on the spread.
const UPCOMING_FILTERS = [
  { key: "sort", label: "Sort", def: "start", opts: [["start", "Start time"], ["move", "Biggest move"], ["consensus", "Consensus %"]] },
  { key: "cons", label: "Consensus", def: "all",
    opts: [["all", "All"], ["strong", "70%+"], ["medium", "60-69%"], ["weak", "Under 60%"]] },
  { key: "size", label: "Move", def: "all",
    opts: [["all", "All"], ["none", "No move"], ["small", "0.5-1.5 pts"], ["medium", "2-3.5 pts"], ["big", "4+ pts"]] },
  { key: "key", label: "Key number", def: "all", opts: [["all", "All"], ["crossed", "Touched 3 or 7"]], needsKeyNumbers: true },
];
let upcomingFilters = Object.fromEntries(UPCOMING_FILTERS.map(d => [d.key, d.def]));
try { Object.assign(upcomingFilters, JSON.parse(localStorage.getItem("wagrx-upcoming-filters") || "{}")); } catch (e) {}

// null = no line posted yet (never matches a move-size filter, sorts last by move)
function upcomingMoveSize(g) {
  return (g.current_home === null || g.current_home === undefined) ? null : Math.abs(g.current_home - g.open_home);
}
function upcomingConfidence(g) {
  const c = g.model ? parseInt(g.model.confidence, 10) : NaN;
  return isNaN(c) ? null : c;
}

function passesUpcomingFilters(g, hasKeyNumbers) {
  const size = upcomingMoveSize(g);
  const f = upcomingFilters;
  if (upcomingDate !== "all" && etDay(g.start) !== upcomingDate) return false;
  const conf = upcomingConfidence(g);
  if (f.cons === "strong" && !(conf >= 70)) return false;
  if (f.cons === "medium" && !(conf >= 60 && conf < 70)) return false;
  if (f.cons === "weak" && !(conf !== null && conf < 60)) return false;
  if (f.size === "none" && (size === null || g.toward)) return false;
  if (f.size === "small" && !(size >= 0.5 && size <= 1.5)) return false;
  if (f.size === "medium" && !(size >= 2 && size <= 3.5)) return false;
  if (f.size === "big" && !(size >= 4)) return false;
  if (hasKeyNumbers && f.key === "crossed" && !g.crosses_key) return false;
  return true;
}

function saveUpcomingFilters() {
  try { localStorage.setItem("wagrx-upcoming-filters", JSON.stringify(upcomingFilters)); } catch (e) {}
}

function setUpcomingFilter(key, value) {
  upcomingFilters[key] = value;
  saveUpcomingFilters();
  renderUpcoming();
}

function setUpcomingDate(value) {
  upcomingDate = value;
  renderUpcoming();
}

function clearUpcomingFilters() {
  for (const d of UPCOMING_FILTERS) if (d.key !== "sort") upcomingFilters[d.key] = d.def;
  upcomingDate = "all";
  saveUpcomingFilters();
  renderUpcoming();
}

// "Model picks as of <last full run>": picks, injuries and splits are rebuilt by the full runs, lines refresh every cycle.
function modelNote(games) {
  const times = games.map(g => g.model && g.model.updated).filter(Boolean).sort();
  return times.length ? ` Model picks as of ${fmtTime(times[times.length - 1])}; they can change before game time.` : " No model picks yet.";
}

function renderUpcoming() {
  const el = document.getElementById("upcoming");
  const sport = SPORTS.find(x => x.key === upcomingSport);
  const seg = `<div class="seg upcoming-seg" role="group" aria-label="Sport">${SPORTS.map(sp =>
    `<button class="range-btn${sp.key === upcomingSport ? " active" : ""}" onclick="selectUpcomingSport('${sp.key}')">${sp.label}</button>`).join("")}</div>`;
  const data = upcomingCache[upcomingSport];
  if (data === undefined) { el.innerHTML = seg + '<div class="empty-state">Loading&hellip;</div>'; return; }
  if (data === null) { el.innerHTML = seg + `<div class="empty-state">No upcoming ${sport.label} lines posted yet.</div>`; return; }

  const games = data.games || [];
  const header = `<div class="perf-updated">${sport.label}, next 7 days. Updated ${fmtTime(data.updated)}. Lines from ESPN (DraftKings).${modelNote(games)}</div>`;
  if (!games.length) {
    el.innerHTML = seg + header + `<div class="empty-state">No upcoming ${sport.label} games with lines yet.</div>`;
    return;
  }

  const hasKeyNumbers = (data.key_numbers || []).length > 0;
  // Dates that actually have games, with counts. A stale selection falls back to all dates.
  const dayCounts = {};
  for (const g of games) { const d = etDay(g.start); dayCounts[d] = (dayCounts[d] || 0) + 1; }
  const days = Object.keys(dayCounts).sort();
  if (upcomingDate !== "all" && !dayCounts[upcomingDate]) upcomingDate = "all";

  const kept = games.filter(g => passesUpcomingFilters(g, hasKeyNumbers));
  // Stable sorts: ties (and games with no value) stay in start order, no-value games last.
  const sortKey = { move: upcomingMoveSize, consensus: upcomingConfidence }[upcomingFilters.sort];
  if (sortKey) kept.sort((x, y) => (sortKey(y) ?? -1) - (sortKey(x) ?? -1));

  const dateSelect = `<select class="filter-select${upcomingDate !== "all" ? " on" : ""}" aria-label="Date" onchange="setUpcomingDate(this.value)">`
    + `<option value="all">Date: All (${games.length})</option>`
    + days.map(d => {
      const [y, m, dd] = d.split("-").map(Number);
      const label = new Date(y, m - 1, dd).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
      return `<option value="${d}"${upcomingDate === d ? " selected" : ""}>Date: ${label} (${dayCounts[d]})</option>`;
    }).join("") + `</select>`;
  const defs = UPCOMING_FILTERS.filter(d => !d.needsKeyNumbers || hasKeyNumbers);
  const selects = dateSelect + defs.map(d =>
    `<select class="filter-select${upcomingFilters[d.key] !== d.def ? " on" : ""}" aria-label="${d.label}" onchange="setUpcomingFilter('${d.key}', this.value)">${
      d.opts.map(([v, t]) => `<option value="${v}"${upcomingFilters[d.key] === v ? " selected" : ""}>${d.label}: ${t}</option>`).join("")}</select>`
  ).join("");
  const active = upcomingDate !== "all" || defs.some(d => d.key !== "sort" && upcomingFilters[d.key] !== d.def);
  const meta = active ? `<span>Showing ${kept.length} of ${games.length}</span><button class="filter-clear" onclick="clearUpcomingFilters()">Clear filters</button>` : "";
  const bar = `<div class="filter-bar"><div class="filter-row">${selects}</div><div class="filter-meta">${meta}</div></div>`;

  let day = null, html = "";
  upcomingGames = [];
  kept.forEach((g, i) => {
    if (upcomingFilters.sort === "start") {  // day headings only make sense in kickoff order
      const label = etLabel(g.start, { weekday: "long", month: "short", day: "numeric" });
      if (label !== day) { day = label; html += `<div class="perf-sub">${label}</div>`; }
    }
    html += renderUpcomingGame(g, data.key_numbers || [], i);
  });
  el.innerHTML = seg + header + bar + (html || '<div class="empty-state">No games match these filters.</div>');
}

function loadUpcoming() {
  const key = upcomingSport;
  delete upcomingCache[key];  // always fetch fresh when the tab or sport is opened
  renderUpcoming();
  fetch(`${key}_upcoming.json?_=` + Date.now())
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(data => { upcomingCache[key] = data; })
    .catch(err => { upcomingCache[key] = null; console.error(err); })
    .finally(() => { if (key === upcomingSport && currentView === "upcoming") renderUpcoming(); });
}

// ---- History tab: one graded day at a time, per sport (from <sport>_history.json) ----
let historySport = null;
let historyData = null;
let historyDate = null;
let historyRuns = [];   // that day's saved runs (days/<sport>/<date>.json), if any
let historyRun = "graded";  // "graded" (each game's last run before kickoff) or an index into historyRuns
let historyGames = [];  // games currently rendered in History (for the detail dropdowns)

function selectHistory() {
  currentView = "history";
  renderTabs();
  setViewVisibility();
  loadHistory(historySport || currentSport);
}

function historyDays() {
  const days = (historyData && historyData.days) || {};
  return Object.keys(days).filter(d => (days[d] || []).length).sort().reverse();
}

function fmtDate(d) {
  const [y, m, day] = d.split("-").map(Number);
  return new Date(y, m - 1, day).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric", year: "numeric" });
}

function loadHistory(key) {
  historySport = key;
  historyData = null;
  const sport = SPORTS.find(s => s.key === key);
  document.getElementById("history").innerHTML = '<div class="empty-state">Loading&hellip;</div>';
  fetch(sport.histFile + "?_=" + Date.now())
    .then(r => r.ok ? r.json() : null)
    .catch(() => null)
    .then(data => {
      historyData = data;
      const days = historyDays();
      if (!days.includes(historyDate)) historyDate = days[0] || null;
      loadHistoryRuns();
    });
}

function selectHistoryDate(d) {
  historyDate = d;
  loadHistoryRuns();
}

function loadHistoryRuns() {
  historyRuns = [];
  historyRun = "graded";
  renderHistory();
  if (!historyDate) return;
  const sport = historySport, date = historyDate;
  fetch(`days/${sport}/${date}.json?_=` + Date.now())
    .then(r => r.ok ? r.json() : null)
    .catch(() => null)
    .then(data => {
      if (sport !== historySport || date !== historyDate) return;  // user moved on meanwhile
      historyRuns = (data && data.snapshots) || [];
      renderHistory();
    });
}

function selectHistoryRun(v) {
  historyRun = v === "graded" ? "graded" : parseInt(v, 10);
  renderHistory();
}

function resultTag(result) {
  if (result === "WIN") return '<span class="tag agree">WIN</span>';
  if (result === "LOSS") return '<span class="tag disagree">LOSS</span>';
  return "";
}

function renderHistoryGame(g) {
  const picks = g.picks || {};
  const c = picks.CONSENSUS || {};
  const modelRows = Object.entries(picks).filter(([k]) => k !== "CONSENSUS" && !isSharpKey(k)).map(([k, p]) =>
    `<tr><td>${k}</td><td>${p.pick || "N/A"}${resultTag(p.result)}</td></tr>`
  ).join("");
  const final = g.final ? ` &middot; Final: ${g.final}` : "";
  const votes = Object.entries(picks).filter(([k]) => k !== "CONSENSUS" && !isSharpKey(k))
    .map(([, p]) => [g.team_home, g.team_away].includes(p.pick) ? p.pick : null);
  const agreement = agreementHtml(votes, c.pick);
  const consensusLine = pickLineHtml(g.line, g.favorite, c.pick, [g.team_home, g.team_away]);
  const statusTag = g.status ? `<span class="tag neutral">${g.status.split(" (")[0]}</span>` : resultTag(c.result);
  const sharpGame = { ...g, detail: { "M6: Sharp Money": g.sharp || {} } };
  return `
    <div class="game-card">
      <div class="game-header" onclick="this.closest('.game-card').classList.toggle('expanded')">
        <div class="game-title-row">
          <div>
            <div class="game-title">${g.game || ""}</div>
            <div class="game-meta">Line: ${g.line || "N/A"}${final}</div>
          </div>
          <span class="chevron">&#9654;</span>
        </div>
        <div class="consensus-row">
          <div>
            <div class="consensus-label">Consensus</div>
            <div class="consensus-pick">${c.pick || "N/A"}${consensusLine}${statusTag}</div>
          </div>
          <div class="conf-col"><div class="confidence-badge">${g.confidence || "N/A"}</div>${agreement}</div>
        </div>
        ${renderSharpRow(sharpGame, g.cover)}
        ${renderLineMoveHistory(g)}
      </div>
      <div class="models-wrap">
        <table class="models">${modelRows}</table>
      </div>
    </div>
  `;
}

function renderHistory() {
  const sport = SPORTS.find(s => s.key === historySport);
  const days = historyDays();
  const sportOpts = SPORTS.map(s => `<option value="${s.key}"${s.key === historySport ? " selected" : ""}>${s.label}</option>`).join("");
  const dateOpts = days.length
    ? days.map(d => `<option value="${d}"${d === historyDate ? " selected" : ""}>${fmtDate(d)}</option>`).join("")
    : "<option>No graded days</option>";
  const runOpts = `<option value="graded"${historyRun === "graded" ? " selected" : ""}>Graded</option>` + historyRuns.map((r, i) =>
    `<option value="${i}"${i === historyRun ? " selected" : ""}>${new Date(r.time).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" })}</option>`
  ).join("");
  const controls = `
    <div class="controls-row">
      <select class="runtime-select" onchange="loadHistory(this.value)">${sportOpts}</select>
      <select class="runtime-select" onchange="selectHistoryDate(this.value)"${days.length ? "" : " disabled"}>${dateOpts}</select>
      ${historyRuns.length ? `<select class="runtime-select" onchange="selectHistoryRun(this.value)" title="Run time">${runOpts}</select>` : ""}
    </div>`;
  const container = document.getElementById("history");
  if (!days.length) {
    container.innerHTML = controls + `<div class="empty-state">No graded ${sport.label} games yet.</div>`;
    return;
  }
  const gradedGames = historyData.days[historyDate] || [];
  const run = historyRun === "graded" ? null : historyRuns[historyRun];

  // Build one item per game for the chosen view, then filter/sort them like the Games view.
  let items, results, note;
  if (historyRun === "graded" && historyRuns.length) {
    // Each game exactly as it looked in the run that was graded (its last run before
    // kickoff). Games graded from the morning file (no saved run) use the simple card.
    historyGames = [];
    items = gradedGames.map((h, order) => {
      const res = ((h.picks || {}).CONSENSUS || {}).result || null;
      const snap = h.graded_run && historyRuns.find(r => r.time === h.graded_run);
      const g = snap && (snap.games || []).find(x => x.team_home === h.team_home && x.team_away === h.team_away);
      if (!g) return { fx: historyEntryFacts(h, res), html: () => renderHistoryGame(h) };
      historyGames.push(g);
      const idx = historyGames.length - 1;
      return { fx: gameFacts(g, res), html: () => renderGame(g, idx,
        { cover: h.cover, final: h.final, status: h.status, run: h.graded_run }, "history") };
    });
    results = gradedGames.map(g => (g.picks && g.picks.CONSENSUS || {}).result);
    note = "Each game as of its last run before kickoff, which is what was graded.";
  } else if (!run) {
    // Days from before runs were saved only have the graded morning picks.
    historyGames = [];
    items = gradedGames.map(h => {
      const res = ((h.picks || {}).CONSENSUS || {}).result || null;
      return { fx: historyEntryFacts(h, res), html: () => renderHistoryGame(h) };
    });
    results = gradedGames.map(g => (g.picks && g.picks.CONSENSUS || {}).result);
    note = "Run-by-run snapshots weren't saved for this day, so this shows the graded morning picks.";
  } else {
    // A saved run: the exact cards the Games view showed at that time, plus the grade.
    historyGames = run.games || [];
    const grades = historyGames.map(g => {
      const h = gradedGames.find(x => x.team_home === g.team_home && x.team_away === g.team_away);
      return h ? { cover: h.cover, final: h.final, status: h.status } : { status: "Not graded" };
    });
    results = historyGames.map((g, i) => {
      const c = (g.picks || {}).CONSENSUS || "";
      if (!grades[i].cover || !c.startsWith("TAKE:")) return null;
      return c.replace("TAKE:", "").trim() === grades[i].cover ? "WIN" : "LOSS";
    });
    items = historyGames.map((g, i) => ({ fx: gameFacts(g, results[i]), html: () => renderGame(g, i, grades[i], "history") }));
    note = `Showing the ${fmtTime(run.time)} run, graded against final scores.`;
  }
  const shown = applyFilters(items, "history");
  container.innerHTML = controls + dayRecordBar(results, items.length, note)
    + renderFilterBar("history", shown.length, items.length)
    + (shown.length ? shown.map(it => it.html()).join("") : '<div class="empty-state">No games match these filters.</div>');
}

// Facts for a simple History entry (picks stored as { pick, result }, sharp as raw splits).
function historyEntryFacts(h, result) {
  const c = ((h.picks || {}).CONSENSUS || {}).pick;
  const g = { team_home: h.team_home, team_away: h.team_away, confidence: h.confidence,
              picks: { CONSENSUS: c && c !== "N/A" && c !== "SPLIT" && c !== "PUSH" ? "TAKE: " + c : "" },
              detail: { "M6: Sharp Money": h.sharp || {} } };
  return gameFacts(g, result);
}

function dayRecordBar(results, count, note) {
  const w = results.filter(r => r === "WIN").length;
  const l = results.filter(r => r === "LOSS").length;
  const pct = w + l ? ` (${Math.round(w / (w + l) * 100)}%)` : "";
  return `
    <div class="status-bar">
      <span>Consensus: <span class="hist-record">${w}-${l}</span>${pct}</span>
      <span>${count} ${count === 1 ? "game" : "games"}</span>
    </div>
    <div class="hist-note">${note}</div>`;
}

(function init() {
  let saved = null;
  try { saved = localStorage.getItem("wagrx-last-sport"); } catch (e) {}
  if (saved && SPORTS.some(s => s.key === saved)) currentSport = saved;
  renderTabs();
  setViewVisibility();
  loadSport(currentSport);
})();
</script>
