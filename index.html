<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WagrX Dashboard</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card-bg: #ffffff;
    --text: #1a1d23;
    --text-dim: #6b7280;
    --border: #e3e5e9;
    --accent: #2563eb;
    --win: #15803d;
    --win-bg: #dcfce7;
    --loss: #b91c1c;
    --loss-bg: #fee2e2;
    --neutral-bg: #f1f2f4;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15171c;
      --card-bg: #1e2128;
      --text: #e8e9ec;
      --text-dim: #9199a8;
      --border: #30343d;
      --accent: #5b8def;
      --win: #4ade80;
      --win-bg: #14532d;
      --loss: #f87171;
      --loss-bg: #7f1d1d;
      --neutral-bg: #2a2e37;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15171c;
    --card-bg: #1e2128;
    --text: #e8e9ec;
    --text-dim: #9199a8;
    --border: #30343d;
    --accent: #5b8def;
    --win: #4ade80;
    --win-bg: #14532d;
    --loss: #f87171;
    --loss-bg: #7f1d1d;
    --neutral-bg: #2a2e37;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 16px;
  }
  .wrap { max-width: 780px; margin: 0 auto; }
  .top-bar { display: flex; justify-content: flex-start; margin-bottom: 10px; }
  .export-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card-bg);
    color: var(--text);
    font-size: 0.82rem;
    cursor: pointer;
  }
  .export-btn:hover { border-color: var(--accent); color: var(--accent); }
  header { margin-bottom: 20px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px 0; }
  .subtitle { color: var(--text-dim); font-size: 0.9rem; }
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
    padding: 10px 14px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 0.85rem;
    color: var(--text-dim);
  }
  .controls-row { display: flex; gap: 8px; margin-top: 10px; }
  .search-box {
    flex: 1;
    min-width: 0;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card-bg);
    color: var(--text);
    font-size: 0.92rem;
  }
  .search-box::placeholder { color: var(--text-dim); }
  .search-box:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .runtime-select {
    flex-shrink: 0;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card-bg);
    color: var(--text);
    font-size: 0.88rem;
    max-width: 45%;
  }
  .runtime-select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .game-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .game-card.hidden-by-search { display: none; }
  .game-header { cursor: pointer; user-select: none; }
  .game-title-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .game-title { font-weight: 600; font-size: 1.02rem; margin-bottom: 2px; }
  .game-meta { color: var(--text-dim); font-size: 0.85rem; margin-bottom: 12px; }
  .chevron {
    color: var(--text-dim);
    font-size: 0.8rem;
    flex-shrink: 0;
    margin-top: 3px;
    transition: transform 0.15s ease;
  }
  .game-card.expanded .chevron { transform: rotate(90deg); }
  .consensus-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--neutral-bg);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .consensus-label { font-size: 0.78rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; }
  .consensus-pick { font-weight: 700; font-size: 1rem; }
  .confidence-badge {
    font-weight: 700;
    font-size: 0.95rem;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
  }
  .models-wrap { max-height: 0; overflow: hidden; transition: max-height 0.2s ease; }
  .game-card.expanded .models-wrap { max-height: 600px; }
  table.models { width: 100%; border-collapse: collapse; font-size: 0.88rem; margin-top: 12px; }
  table.models td { padding: 6px 4px; border-top: 1px solid var(--border); }
  table.models td:first-child { color: var(--text-dim); width: 42%; }
  .tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 0.78rem;
    font-weight: 600;
    margin-left: 6px;
  }
  .tag.agree { background: var(--win-bg); color: var(--win); }
  .tag.disagree { background: var(--loss-bg); color: var(--loss); }
  .detail-box {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  .detail-select {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--neutral-bg);
    color: var(--text);
    font-size: 0.85rem;
    margin-bottom: 8px;
  }
  .detail-text {
    font-size: 0.88rem;
    color: var(--text);
    padding: 8px 2px;
  }
  .detail-text .num { font-weight: 700; }
  .empty-state { color: var(--text-dim); text-align: center; padding: 40px 16px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top-bar">
    <button class="export-btn" onclick="exportCSV()">&#8595; Export CSV</button>
  </div>
  <header>
    <h1>WagrX: NCAAF</h1>
    <div class="subtitle">Model consensus for today's games</div>
    <div class="status-bar">
      <span id="updated-at">Loading&hellip;</span>
      <span id="game-count"></span>
    </div>
    <div class="controls-row">
      <select id="runtime-select" class="runtime-select" onchange="selectSnapshot(this.value)"></select>
      <input type="search" id="search" class="search-box" placeholder="Search teams&hellip;" oninput="filterGames()">
    </div>
  </header>
  <main id="games"></main>
</div>

<script>
const MODEL_KEYS = ["M1: Normal Score", "M2: Relevance", "M3: Efficiency", "M4: ATS Trends", "M5: Luck", "M6: Sharp Money", "CONSENSUS"];

function fmtTime(iso) {
  if (!iso) return "never run yet";
  try {
    const d = new Date(iso);
    return d.toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
  } catch (e) {
    return iso;
  }
}

function fmtNum(v) {
  if (v === undefined || v === null || v === "N/A") return null;
  const n = parseFloat(v);
  return isNaN(n) ? String(v) : (Number.isInteger(n) ? String(n) : n.toFixed(1));
}

function formatDetail(g, modelKey) {
  const teamHome = g.team_home || "Home";
  const teamAway = g.team_away || "Away";

  if (modelKey === "CONSENSUS") {
    const pick = (g.picks && g.picks.CONSENSUS) ? g.picks.CONSENSUS.replace("TAKE: ", "") : "N/A";
    return `Weighted vote: <span class="num">${g.confidence || "N/A"}</span> for ${pick}`;
  }

  const d = (g.detail || {})[modelKey];
  if (!d) return "No underlying data available for this model.";

  if (modelKey === "M3: Efficiency") {
    const m = fmtNum(d.margin);
    if (m === null) return "No predicted margin available.";
    const favored = parseFloat(d.margin) >= 0 ? teamHome : teamAway;
    return `Predicted margin: ${favored} by <span class="num">${Math.abs(parseFloat(d.margin)).toFixed(1)}</span>`;
  }

  if (modelKey === "M6: Sharp Money") {
    if (d.home_b === undefined || d.home_b === null) return "No sharp money data available.";
    return `${teamHome}: <span class="num">${fmtNum(d.home_b)}%</span> bets / <span class="num">${fmtNum(d.home_m)}%</span> money`
      + `&nbsp;&nbsp;|&nbsp;&nbsp;`
      + `${teamAway}: <span class="num">${fmtNum(d.away_b)}%</span> bets / <span class="num">${fmtNum(d.away_m)}%</span> money`;
  }

  // M1, M2, M4, M5 all share a simple home/away numeric-pair shape.
  const homeVal = fmtNum(d.home);
  const awayVal = fmtNum(d.away);
  if (homeVal === null && awayVal === null) return "No data available for this model.";
  return `${teamHome}: <span class="num">${homeVal ?? "N/A"}</span>`
    + `&nbsp;&nbsp;|&nbsp;&nbsp;`
    + `${teamAway}: <span class="num">${awayVal ?? "N/A"}</span>`;
}

function renderGame(g, idx) {
  const picks = g.picks || {};
  const modelRows = MODEL_KEYS.filter(k => k !== "CONSENSUS").map(key => {
    const pick = picks[key];
    const consensusPick = picks.CONSENSUS || "";
    let tag = "";
    if (pick && pick.startsWith("TAKE:") && consensusPick && consensusPick.startsWith("TAKE:")) {
      tag = pick === consensusPick
        ? '<span class="tag agree">AGREE</span>'
        : '<span class="tag disagree">DISAGREE</span>';
    }
    const label = pick ? pick.replace("TAKE: ", "") : "N/A";
    return `<tr><td>${key}</td><td>${label}${tag}</td></tr>`;
  }).join("");

  const consensus = picks.CONSENSUS ? picks.CONSENSUS.replace("TAKE: ", "") : "N/A";
  const confidence = g.confidence || "N/A";
  const searchKey = (g.game || "").toLowerCase();
  const detailOptions = MODEL_KEYS.map(k => `<option value="${k}">${k}</option>`).join("");

  return `
    <div class="game-card" data-search="${searchKey}">
      <div class="game-header" onclick="this.closest('.game-card').classList.toggle('expanded')">
        <div class="game-title-row">
          <div>
            <div class="game-title">${g.game || ""}</div>
            <div class="game-meta">Line: ${g.spread || "N/A"} &middot; Favorite: ${g.favorite || "N/A"}</div>
          </div>
          <span class="chevron">&#9654;</span>
        </div>
        <div class="consensus-row">
          <div>
            <div class="consensus-label">Consensus</div>
            <div class="consensus-pick">${consensus}</div>
          </div>
          <div class="confidence-badge">${confidence}</div>
        </div>
      </div>
      <div class="models-wrap">
        <table class="models">${modelRows}</table>
        <div class="detail-box">
          <select class="detail-select" onchange="showModelDetail(${idx}, this.value, this)">${detailOptions}</select>
          <div class="detail-text" id="detail-${idx}">${formatDetail(g, MODEL_KEYS[0])}</div>
        </div>
      </div>
    </div>
  `;
}

function showModelDetail(idx, modelKey) {
  const g = currentGames[idx];
  if (!g) return;
  document.getElementById("detail-" + idx).innerHTML = formatDetail(g, modelKey);
}

function filterGames() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const cards = document.querySelectorAll(".game-card");
  let visible = 0;
  cards.forEach(card => {
    const match = !q || (card.dataset.search || "").includes(q);
    card.classList.toggle("hidden-by-search", !match);
    if (match) visible++;
  });
  document.getElementById("game-count").textContent = visible + (visible === 1 ? " game" : " games");
}

function csvEscape(val) {
  const s = (val === undefined || val === null) ? "" : String(val);
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function exportCSV() {
  if (!currentGames || currentGames.length === 0) {
    alert("Nothing loaded to export yet.");
    return;
  }
  const headers = ["Game", "Spread", "Favorite", ...MODEL_KEYS, "Confidence"];
  const rows = currentGames.map(g => {
    const picks = g.picks || {};
    const pickVals = MODEL_KEYS.map(k => (picks[k] || "N/A").replace("TAKE: ", ""));
    return [g.game, g.spread, g.favorite, ...pickVals, g.confidence];
  });
  const csv = [headers, ...rows].map(r => r.map(csvEscape).join(",")).join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `wagrx-ncaaf-${(currentSnapshotTime || "export").replace(/[:.]/g, "-")}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

let allSnapshots = [];
let currentGames = [];
let currentSnapshotTime = "";

function populateRuntimeSelect(snapshots) {
  const sel = document.getElementById("runtime-select");
  sel.innerHTML = snapshots.map((s, i) => `<option value="${i}">${fmtTime(s.time)}</option>`).join("");
  sel.value = snapshots.length - 1;
}

function selectSnapshot(indexStr) {
  const snap = allSnapshots[parseInt(indexStr, 10)];
  if (snap) renderSnapshot(snap);
}

function renderSnapshot(snap) {
  currentSnapshotTime = snap.time || "";
  document.getElementById("updated-at").textContent = "Showing: " + fmtTime(snap.time);
  currentGames = snap.games || [];
  document.getElementById("game-count").textContent = currentGames.length + (currentGames.length === 1 ? " game" : " games");
  const container = document.getElementById("games");
  if (currentGames.length === 0) {
    container.innerHTML = '<div class="empty-state">No games in this snapshot.</div>';
    return;
  }
  container.innerHTML = currentGames.map((g, i) => renderGame(g, i)).join("");
  filterGames();
}

fetch("ncaaf_today.json?_=" + Date.now())
  .then(r => r.json())
  .then(data => {
    allSnapshots = data.snapshots || [];
    if (allSnapshots.length === 0) {
      document.getElementById("updated-at").textContent = "No data yet today.";
      document.getElementById("games").innerHTML = '<div class="empty-state">No games loaded yet. Check back after the next run.</div>';
      return;
    }
    populateRuntimeSelect(allSnapshots);
    renderSnapshot(allSnapshots[allSnapshots.length - 1]);
  })
  .catch(err => {
    document.getElementById("updated-at").textContent = "Could not load data.";
    console.error(err);
  });
</script>
</body>
</html>
