<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WagrX</title>
<style>
  :root {
    --bg: #000000;
    --card-bg: #17181d;
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #c98500;
    --text: #e8e9ec;
    --text-dim: #9199a8;
    --border: #2b2f38;
    --accent: #9B8AFB;
    --accent-2: #D08CF7;
    --accent-gradient: linear-gradient(135deg, var(--accent), var(--accent-2));
    --accent-soft: #231f36;
    --win: #4ade80;
    --win-bg: #123020;
    --loss: #f87171;
    --loss-bg: #3a1414;
    --neutral-bg: #21252d;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 16px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 800px; margin: 0 auto; }

  .brand-row {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 18px;
  }
  .brand-logo {
    height: auto;
    width: 100%;
    max-width: 320px;
    display: block;
  }
  .export-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    width: 42px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card-bg);
    color: var(--text-dim);
    font-size: 1rem;
    cursor: pointer;
    box-shadow: var(--shadow);
  }
  .export-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

  .tab-bar {
    display: flex;
    gap: 4px;
    padding: 4px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
    overflow-x: auto;
  }
  .tab-btn {
    flex: 1;
    padding: 9px 10px;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: var(--text-dim);
    font-size: 0.86rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.12s ease, color 0.12s ease;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { background: var(--accent-gradient); color: #fff; }
  /* Sport tabs share the bar equally so every sport's box is the same size. */
  .tab-bar .tab-btn { flex: 1 1 0; min-width: 0; }
  .nav-row { display: flex; gap: 8px; align-items: stretch; margin-bottom: 14px; }
  .nav-row .tab-bar { flex: 1; min-width: 0; margin-bottom: 0; }
  /* History / Performance: outlined utility buttons, visually separate from the sports. */
  .util-tabs { display: flex; gap: 6px; }
  .util-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 14px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: transparent;
    color: var(--text-dim);
    font-size: 0.84rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: color 0.12s ease, border-color 0.12s ease, background 0.12s ease;
  }
  .util-btn svg { flex-shrink: 0; }
  .util-btn:hover { color: var(--text); border-color: var(--text-dim); }
  .util-btn.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  @media (max-width: 600px) {
    .util-btn { padding: 0 11px; }
    .util-btn .util-label { display: none; }
  }
  @media (max-width: 480px) {
    .tab-btn { padding: 8px 4px; font-size: 0.78rem; }
  }

  .day-won { color: var(--win); font-weight: 700; }
  .day-lost { color: var(--loss); font-weight: 700; }
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 10px;
    padding: 10px 14px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 0.85rem;
    color: var(--text-dim);
    box-shadow: var(--shadow);
  }
  .controls-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .search-box {
    flex: 1;
    min-width: 0;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card-bg);
    color: var(--text);
    font-size: 0.92rem;
    box-shadow: var(--shadow);
  }
  .search-box::placeholder { color: var(--text-dim); }
  .search-box:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .runtime-select {
    flex-shrink: 0;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card-bg);
    color: var(--text);
    font-size: 0.88rem;
    max-width: 45%;
    box-shadow: var(--shadow);
  }
  .runtime-select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  @media (max-width: 480px) {
    .controls-row { flex-wrap: wrap; }
    .search-box { order: 5; flex: 1 1 100%; }
  }

  .game-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
  }
  .game-card.hidden-by-search { display: none; }
  .game-header { cursor: pointer; user-select: none; }
  .game-title-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .game-title { font-weight: 700; font-size: 1.02rem; margin-bottom: 2px; }
  .game-meta { color: var(--text-dim); font-size: 0.85rem; margin-bottom: 12px; }
  .chevron {
    color: var(--text-dim);
    font-size: 0.8rem;
    flex-shrink: 0;
    margin-top: 3px;
    transition: transform 0.15s ease;
  }
  .game-card.expanded .chevron { transform: rotate(90deg); }
  .consensus-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--neutral-bg);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .consensus-label { font-size: 0.74rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
  .consensus-pick { font-weight: 700; font-size: 1rem; }
  .sharp-row { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; margin-top: 8px; padding: 0 12px; font-size: 0.85rem; }
  .sharp-row .consensus-label { margin-right: 2px; }
  .sharp-row .tag { margin-left: 0; }
  .sharp-row .dim { color: var(--text-dim); }
  .confidence-badge {
    font-weight: 700;
    font-size: 0.95rem;
    padding: 4px 11px;
    border-radius: 999px;
    background: var(--accent-gradient);
    color: #fff;
  }
  .models-wrap { max-height: 0; overflow: hidden; transition: max-height 0.2s ease; }
  .game-card.expanded .models-wrap { max-height: 600px; }
  table.models { width: 100%; border-collapse: collapse; font-size: 0.88rem; margin-top: 12px; }
  table.models td { padding: 7px 4px; border-top: 1px solid var(--border); }
  table.models td:first-child { color: var(--text-dim); width: 42%; }
  .tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 0.76rem;
    font-weight: 700;
    margin-left: 6px;
  }
  .tag.agree { background: var(--win-bg); color: var(--win); }
  .tag.disagree { background: var(--loss-bg); color: var(--loss); }
  /* Sharp money strength: one amber ramp (kept clear of the green/red AGREE/DISAGREE tags). */
  .tag.sharp-lean { background: transparent; color: #d6b45a; box-shadow: inset 0 0 0 1px #6b5a2a; }
  .tag.sharp-strong { background: #4a3810; color: #f5b43a; }
  .tag.sharp-extreme { background: #f59e0b; color: #1a1200; }
  .detail-box { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
  .detail-select {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--neutral-bg);
    color: var(--text);
    font-size: 0.85rem;
    margin-bottom: 8px;
  }
  .detail-text { font-size: 0.88rem; color: var(--text); padding: 8px 2px; }
  .detail-text .num { font-weight: 700; }
  .empty-state { color: var(--text-dim); text-align: center; padding: 48px 16px; font-size: 0.92rem; }

  .perf-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
  }
  .perf-card h2 {
    font-size: 1rem;
    margin: 0 0 4px;
  }
  .perf-updated { color: var(--text-dim); font-size: 0.78rem; margin-bottom: 10px; }
  table.perf { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  table.perf td, table.perf th {
    padding: 7px 6px;
    border-top: 1px solid var(--border);
    text-align: left;
  }
  table.perf th { color: var(--text-dim); font-weight: 600; font-size: 0.76rem; text-transform: uppercase; letter-spacing: 0.04em; }
  table.perf tr.consensus-row-perf td { font-weight: 700; }
  table.perf tr.consensus-row-perf { background: var(--accent-soft); }
  table.perf tr.sharp-row-perf td { color: var(--text-dim); border-top: 2px solid var(--border); }
  .perf-pct { font-weight: 700; }

  /* Net-wins chart. Series colors: reference palette dark steps, slots 1-4, validated
     against the card surface #17181d (adjacent CVD dE 8.4, normal-vision 19.8, all >= 3:1). */
  .net-card { padding: 18px 18px 14px; }
  .net-head { margin-bottom: 14px; }
  .net-head h2 { font-size: 1.05rem; margin: 10px 0 2px; letter-spacing: 0.01em; }
  .net-sub { color: var(--text-dim); font-size: 0.8rem; }
  .seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--neutral-bg); border: 1px solid var(--border); border-radius: 10px; }
  .range-btn {
    padding: 5px 14px; border: none; border-radius: 7px; background: transparent;
    color: var(--text-dim); font-size: 0.78rem; font-weight: 700; letter-spacing: 0.03em; cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .range-btn:hover { color: var(--text); }
  .range-btn.active { background: var(--accent-gradient); color: #fff; }
  .net-tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 14px; }
  .net-tile {
    text-align: left; padding: 8px 12px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--neutral-bg); color: var(--text); cursor: default; font: inherit;
    transition: border-color 0.15s ease, opacity 0.15s ease;
  }
  .net-tile:hover, .net-tile:focus-visible { border-color: #3a3f4b; outline: none; }
  .net-tile .tile-label { display: flex; align-items: center; gap: 6px; font-size: 0.68rem; font-weight: 700;
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-dim); }
  .net-tile .tile-label i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
  .net-tile .tile-value { font-size: 1.15rem; font-weight: 700; line-height: 1.2; margin-top: 3px; }
  .net-tile .tile-meta { font-size: 0.72rem; color: var(--text-dim); margin-top: 1px; }
  .net-tile.dimmed { opacity: 0.45; }
  .net-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.78rem; color: var(--text); margin-bottom: 4px; }
  .net-legend span { display: inline-flex; align-items: center; gap: 6px; cursor: default; }
  .net-legend i { display: inline-block; width: 16px; height: 2px; border-radius: 1px; }
  .net-legend .muted { color: var(--text-dim); }
  .net-plot { position: relative; }
  .net-plot svg { display: block; width: 100%; overflow: visible; }
  .net-plot text { font-size: 11px; fill: var(--text-dim); font-variant-numeric: tabular-nums; }
  .net-plot .end-label { fill: var(--text); font-weight: 700; font-size: 11.5px; }
  .net-plot .net-line, .net-plot .net-area, .net-plot .net-end, .net-plot .end-label, .net-plot .leader { transition: opacity 0.15s ease; }
  .net-plot .faded { opacity: 0.22; }
  .net-plot .net-area { opacity: 0; }
  .net-plot .net-area.on { opacity: 1; }
  .net-plot.draw .net-line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: net-draw 0.7s ease-out forwards; }
  @keyframes net-draw { to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) { .net-plot.draw .net-line { animation: none; stroke-dashoffset: 0; } }
  .net-tip {
    position: absolute; pointer-events: none; background: #20232b; border: 1px solid var(--border);
    border-radius: 10px; padding: 9px 11px; font-size: 0.78rem; color: var(--text); white-space: nowrap;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45); display: none; z-index: 2;
  }
  .net-tip .tip-date { color: var(--text-dim); margin-bottom: 5px; font-weight: 600; }
  .net-tip .tip-row { display: flex; align-items: center; gap: 8px; line-height: 1.6; }
  .net-tip .tip-row i { width: 12px; height: 2px; border-radius: 1px; display: inline-block; }
  .net-tip .tip-val { font-weight: 700; min-width: 30px; font-variant-numeric: tabular-nums; }
  .net-tip .tip-day { color: var(--text-dim); }
  .net-table summary { cursor: pointer; color: var(--text-dim); font-size: 0.8rem; margin-top: 10px; }
  .net-table table { margin-top: 6px; }
  @media (max-width: 600px) {
    .net-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .net-tile .tile-value { font-size: 1.05rem; }
  }
  .tag.neutral { background: var(--neutral-bg); color: var(--text-dim); }
  .hist-record { font-weight: 700; color: var(--text); }
  .hist-note { color: var(--text-dim); font-size: 0.8rem; margin: -6px 2px 12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand-row">
    <img src="logo-banner.png" alt="WagrX" class="brand-logo">
  </div>

  <div class="nav-row">
    <div class="tab-bar" id="tab-bar"></div>
    <div class="util-tabs" id="util-tabs"></div>
  </div>

  <div class="status-bar" id="status-bar">
    <span id="updated-at">Loading&hellip;</span>
    <span id="day-record"></span>
    <span id="game-count"></span>
  </div>
  <div class="controls-row" id="controls-row">
    <select id="date-select" class="runtime-select" onchange="selectDate(this.value)" title="Day"></select>
    <select id="runtime-select" class="runtime-select" onchange="selectSnapshot(this.value)" title="Run time"></select>
    <input type="search" id="search" class="search-box" placeholder="Search teams&hellip;" oninput="filterGames()">
    <button class="export-btn" onclick="exportCSV()" title="Export current view as CSV">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
    </button>
  </div>
  <main id="games"></main>
  <main id="performance" style="display:none;"></main>
  <main id="history" style="display:none;"></main>
</div>

<script>
const SPORTS = [
  { key: "ncaaf", label: "NCAAF", file: "ncaaf_today.json", perfFile: "ncaaf_performance.json", histFile: "ncaaf_history.json" },
  { key: "nfl",   label: "NFL",   file: "nfl_today.json",   perfFile: "nfl_performance.json", histFile: "nfl_history.json" },
  { key: "nba",   label: "NBA",   file: "nba_today.json",   perfFile: "nba_performance.json", histFile: "nba_history.json" },
  { key: "ncaa",  label: "NCAAB", file: "ncaa_today.json",  perfFile: "ncaa_performance.json", histFile: "ncaa_history.json" },
];

let currentSport = SPORTS[0].key;
let currentView = "games"; // "games", "history" or "performance"
let allSnapshots = [];
let currentGames = [];
let currentSnapshotTime = "";
let currentModelKeys = [];
let todayDate = null;  // date of <sport>_today.json; older days load from days/<sport>/<date>.json

function fmtTime(iso) {
  if (!iso) return "never run yet";
  try {
    const d = new Date(iso);
    return d.toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
  } catch (e) {
    return iso;
  }
}

function fmtNum(v) {
  if (v === undefined || v === null || v === "N/A") return null;
  const n = parseFloat(v);
  return isNaN(n) ? String(v) : (Number.isInteger(n) ? String(n) : n.toFixed(1));
}

// Tier the M6 pick by the gap between money% and bets% on the picked side:
// under 10 pts LEAN, 10-20 STRONG, over 20 EXTREME. Null when there's no data or no gap.
function sharpStrength(g) {
  const d = (g.detail || {})["M6: Sharp Money"];
  if (!d || d.home_b === undefined || d.home_b === null) return null;
  const signed = parseFloat(d.home_m) - parseFloat(d.home_b);
  if (isNaN(signed) || signed === 0) return null;
  const gap = Math.round(Math.abs(signed) * 10) / 10;  // tier on the same 1-decimal value that is displayed
  const team = signed > 0 ? (g.team_home || "Home") : (g.team_away || "Away");
  if (gap > 20) return { label: "EXTREME", cls: "sharp-extreme", gap, team };
  if (gap >= 10) return { label: "STRONG", cls: "sharp-strong", gap, team };
  return { label: "LEAN", cls: "sharp-lean", gap, team };
}

// The scripts store the favorite as "<Team> -fav" (an Excel summary label); drop the suffix here.
function favoriteName(g) {
  return (g.favorite || "N/A").replace(/\s*-fav$/, "");
}

// Always-visible sharp money summary under the consensus box, so it doesn't need the dropdown.
// Sharp money is an info point shown under the consensus, not one of the voting models.
const SHARP_KEY = "M6: Sharp Money";

// cover (History only): the team that covered, to grade the sharp side as info.
function renderSharpRow(g, cover = null) {
  if (!g.picks || !(SHARP_KEY in g.picks)) return "";
  const d = (g.detail || {})["M6: Sharp Money"];
  const s = sharpStrength(g);
  let body;
  if (s) {
    body = `<span>${s.team}</span><span class="tag ${s.cls}">${s.label}</span><span class="dim">${s.gap.toFixed(1)}% gap</span>`
      + (cover ? resultTag(s.team === cover ? "WIN" : "LOSS") : "");
  } else if (d && d.home_b !== undefined && d.home_b !== null) {
    body = `<span class="dim">Even (no gap)</span>`;
  } else {
    body = `<span class="dim">No splits posted yet</span>`;
  }
  return `<div class="sharp-row"><span class="consensus-label">Sharp money</span>${body}</div>`;
}

function formatDetail(g, modelKey) {
  const teamHome = g.team_home || "Home";
  const teamAway = g.team_away || "Away";

  if (modelKey === "CONSENSUS") {
    const pick = (g.picks && g.picks.CONSENSUS) ? g.picks.CONSENSUS.replace("TAKE: ", "") : "N/A";
    return `Weighted vote: <span class="num">${g.confidence || "N/A"}</span> for ${pick}`;
  }

  const d = (g.detail || {})[modelKey];
  if (!d) return "No underlying data available for this model.";

  if (modelKey.includes("Efficiency")) {
    const m = fmtNum(d.margin);
    if (m === null) return "No predicted margin available.";
    const favored = parseFloat(d.margin) >= 0 ? teamHome : teamAway;
    return `Predicted margin: ${favored} by <span class="num">${Math.abs(parseFloat(d.margin)).toFixed(1)}</span>`;
  }

  if (modelKey.includes("Sharp Money")) {
    if (d.home_b === undefined || d.home_b === null) return "No sharp money data available.";
    const s = sharpStrength(g);
    return `${teamHome}: <span class="num">${fmtNum(d.home_b)}%</span> bets / <span class="num">${fmtNum(d.home_m)}%</span> money`
      + `&nbsp;&nbsp;|&nbsp;&nbsp;`
      + `${teamAway}: <span class="num">${fmtNum(d.away_b)}%</span> bets / <span class="num">${fmtNum(d.away_m)}%</span> money`
      + (s ? `<br>Gap: <span class="num">${s.gap.toFixed(1)}%</span> more money than bets on ${s.team}<span class="tag ${s.cls}">${s.label}</span>` : "");
  }

  if (modelKey.includes("QB Injury")) {
    if (!d.home_status) return "No injury data available.";
    return `${teamHome}: <span class="num">${d.home_status}</span>&nbsp;&nbsp;|&nbsp;&nbsp;${teamAway}: <span class="num">${d.away_status}</span>`;
  }

  // M1 Normal Score, M2 Relevance, M4 ATS Trends, M5 Luck all share a simple home/away numeric pair.
  const homeVal = fmtNum(d.home);
  const awayVal = fmtNum(d.away);
  if (homeVal === null && awayVal === null) return "No data available for this model.";
  return `${teamHome}: <span class="num">${homeVal ?? "N/A"}</span>`
    + `&nbsp;&nbsp;|&nbsp;&nbsp;`
    + `${teamAway}: <span class="num">${awayVal ?? "N/A"}</span>`;
}

// grade (History only): { cover, final, status } from that day's graded results.
// scope keeps the detail-dropdown ids unique between the Games and History views.
function renderGame(g, idx, grade = null, scope = "games") {
  const picks = g.picks || {};
  const graded = grade && grade.cover;
  const gradeTag = pick => {
    if (!graded || !pick || !pick.startsWith("TAKE:")) return "";
    return resultTag(pick.replace("TAKE:", "").trim() === grade.cover ? "WIN" : "LOSS");
  };
  const modelKeys = Object.keys(picks);
  const modelRows = modelKeys.filter(k => k !== "CONSENSUS" && k !== SHARP_KEY).map(key => {
    const pick = picks[key];
    const consensusPick = picks.CONSENSUS || "";
    let tag = gradeTag(pick);  // once graded, WIN/LOSS replaces AGREE/DISAGREE
    if (!graded && pick && pick.startsWith("TAKE:") && consensusPick && consensusPick.startsWith("TAKE:")) {
      tag = pick === consensusPick
        ? '<span class="tag agree">AGREE</span>'
        : '<span class="tag disagree">DISAGREE</span>';
    }
    const label = pick ? pick.replace("TAKE: ", "") : "N/A";
    let strengthTag = "";
    if (key.includes("Sharp Money") && pick && pick.startsWith("TAKE:")) {
      const s = sharpStrength(g);
      if (s) strengthTag = `<span class="tag ${s.cls}">${s.label}</span>`;
    }
    return `<tr><td>${key}</td><td>${label}${strengthTag}${tag}</td></tr>`;
  }).join("");

  const consensus = picks.CONSENSUS ? picks.CONSENSUS.replace("TAKE: ", "") : "N/A";
  const confidence = g.confidence || "N/A";
  const searchKey = (g.game || "").toLowerCase();
  const detailOptions = modelKeys.map(k => `<option value="${k}">${k === SHARP_KEY ? "Sharp Money (info)" : k}</option>`).join("");
  const finalMeta = (grade && grade.final ? ` &middot; Final: ${grade.final}` : "")
    + (grade && grade.run ? ` &middot; Graded: ${new Date(grade.run).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" })} run` : "");
  let consensusTag = gradeTag(picks.CONSENSUS || "");
  if (!consensusTag && grade && grade.status) consensusTag = `<span class="tag neutral">${grade.status.split(" (")[0]}</span>`;

  return `
    <div class="game-card" data-search="${searchKey}">
      <div class="game-header" onclick="this.closest('.game-card').classList.toggle('expanded')">
        <div class="game-title-row">
          <div>
            <div class="game-title">${g.game || ""}</div>
            <div class="game-meta">Line: ${g.spread || "N/A"} &middot; Favorite: ${favoriteName(g)}${finalMeta}</div>
          </div>
          <span class="chevron">&#9654;</span>
        </div>
        <div class="consensus-row">
          <div>
            <div class="consensus-label">Consensus</div>
            <div class="consensus-pick">${consensus}${consensusTag}</div>
          </div>
          <div class="confidence-badge">${confidence}</div>
        </div>
        ${renderSharpRow(g, grade && grade.cover)}
      </div>
      <div class="models-wrap">
        <table class="models">${modelRows}</table>
        <div class="detail-box">
          <select class="detail-select" onchange="showModelDetail('${scope}', ${idx}, this.value)">${detailOptions}</select>
          <div class="detail-text" id="detail-${scope}-${idx}">${formatDetail(g, modelKeys[0])}</div>
        </div>
      </div>
    </div>
  `;
}

function showModelDetail(scope, idx, modelKey) {
  const g = (scope === "history" ? historyGames : currentGames)[idx];
  if (!g) return;
  document.getElementById(`detail-${scope}-${idx}`).innerHTML = formatDetail(g, modelKey);
}

function filterGames() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const cards = document.querySelectorAll("#games .game-card");
  let visible = 0;
  cards.forEach(card => {
    const match = !q || (card.dataset.search || "").includes(q);
    card.classList.toggle("hidden-by-search", !match);
    if (match) visible++;
  });
  document.getElementById("game-count").textContent = visible + (visible === 1 ? " game" : " games");
}

function csvEscape(val) {
  const s = (val === undefined || val === null) ? "" : String(val);
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function exportCSV() {
  if (!currentGames || currentGames.length === 0) {
    alert("Nothing loaded to export yet.");
    return;
  }
  const headers = ["Game", "Spread", "Favorite", ...currentModelKeys, "Confidence"];
  const rows = currentGames.map(g => {
    const picks = g.picks || {};
    const pickVals = currentModelKeys.map(k => (picks[k] || "N/A").replace("TAKE: ", ""));
    return [g.game, g.spread, favoriteName(g), ...pickVals, g.confidence];
  });
  const csv = [headers, ...rows].map(r => r.map(csvEscape).join(",")).join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `wagrx-${currentSport}-${(currentSnapshotTime || "export").replace(/[:.]/g, "-")}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function selectSnapshot(indexStr) {

  currentSnapshotTime = snap.time || "";

function selectSport(key) {
  const wasOtherView = currentView !== "games";
  currentView = "games";
  if (key === currentSport && allSnapshots.length && !wasOtherView) { loadSport(key); return; }
  currentSport = key;
  try { localStorage.setItem("wagrx-last-sport", key); } catch (e) {}
  renderTabs();

  loadSport(key);

function loadSport(key) {
  delete historyCache[key];  // pick up a new night's grading on reload
  const sport = SPORTS.find(s => s.key === key);
  document.getElementById("updated-at").textContent = "Loading…";
  document.getElementById("games").innerHTML = "";
  document.getElementById("runtime-select").innerHTML = "";
  document.getElementById("date-select").innerHTML = "";
  document.getElementById("search").value = "";

  Promise.all([
    fetch(sport.file + "?_=" + Date.now()).then(r => r.json()),
    fetch(`days/${key}/index.json?_=` + Date.now()).then(r => r.ok ? r.json() : []).catch(() => []),
  ])
    .then(([data, dates]) => {
      todayDate = data.date || null;
      populateDateSelect(dates, todayDate);
      showDay(data);
    })
    .catch(err => {
      document.getElementById("updated-at").textContent = "Could not load data.";
      document.getElementById("games").innerHTML = '<div class="empty-state">Could not load data for this sport yet.</div>';
      console.error(err);
    });

function populateDateSelect(dates, latest) {
  const sel = document.getElementById("date-select");
  const all = [...new Set([...(latest ? [latest] : []), ...dates])].sort().reverse();
  sel.innerHTML = all.map(d => {
    const [y, m, day] = d.split("-").map(Number);
    const label = new Date(y, m - 1, day).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
    return `<option value="${d}">${label}</option>`;
  }).join("");
  sel.value = latest || all[0] || "";
  sel.style.display = all.length ? "" : "none";
}

// The day's graded consensus record (same as History's Graded view), from <sport>_history.json.
const historyCache = {};

function showDayRecord(sportKey, date) {
  const el = document.getElementById("day-record");
  el.innerHTML = "";
  if (!date) return;
  const sport = SPORTS.find(s => s.key === sportKey);
  const cached = historyCache[sportKey];
  const load = cached ? Promise.resolve(cached)
    : fetch(sport.histFile + "?_=" + Date.now()).then(r => r.ok ? r.json() : null).catch(() => null)
        .then(d => (historyCache[sportKey] = d));
  load.then(hist => {
    if (sportKey !== currentSport) return;  // switched sports meanwhile
    const games = hist && hist.days && hist.days[date];
    if (!games || !games.length) {
      el.textContent = "Not graded yet";
      return;
    }
    const results = games.map(g => (g.picks && g.picks.CONSENSUS || {}).result);
    const w = results.filter(r => r === "WIN").length;
    const l = results.filter(r => r === "LOSS").length;
    el.innerHTML = `Record: <span class="day-won">Won ${w}</span> &middot; <span class="day-lost">Lost ${l}</span>`;
  });
}

function showDay(data) {
  allSnapshots = data.snapshots || [];
  showDayRecord(currentSport, data.date);
  document.getElementById("runtime-select").innerHTML = "";
  if (allSnapshots.length === 0) {
    document.getElementById("updated-at").textContent = "No data yet today.";
    document.getElementById("game-count").textContent = "";
    document.getElementById("games").innerHTML = '<div class="empty-state">No games loaded yet. Check back after the next run.</div>';
    return;
  }
  populateRuntimeSelect(allSnapshots);
  renderSnapshot(allSnapshots[allSnapshots.length - 1]);
}

function selectDate(d) {

  document.getElementById("games").innerHTML = '<div class="empty-state">Loading&hellip;</div>';

function renderPerfTable(sport, data) {

  if (data.models[SHARP_KEY]) entries.push([SHARP_KEY, data.models[SHARP_KEY]]);
  const rows = entries.map(([key, rec]) => {
    const w = rec.W || 0, l = rec.L || 0, total = w + l;

    const isConsensus = key === "CONSENSUS";
    const isSharp = key === SHARP_KEY;
    return `<tr class="${isConsensus ? "consensus-row-perf" : isSharp ? "sharp-row-perf" : ""}">
      <td>${isSharp ? "Sharp Money (info, not in consensus)" : key}</td>
      <td>${w}-${l}</td>
      <td class="perf-pct">${pct}</td>
    </tr>`;
  }).join("");
  const updated = data.updated ? fmtTime(data.updated) : "N/A";
  return `
    <div class="perf-updated">Last graded: ${updated}</div>
    <table class="perf">
      <tr><th>Model</th><th>Record</th><th>Win %</th></tr>
      ${rows}

}

// ---- Performance: net wins (consensus W minus L, against the spread) over time ----
const NET_RANGES = [{ key: "1w", label: "1W", days: 7 }, { key: "1m", label: "1M", days: 30 },
                    { key: "1y", label: "1Y", days: 365 }, { key: "all", label: "All", days: null }];
let netRange = "1m";
let netData = null;   // { sportKey: { "YYYY-MM-DD": { w, l } } }
let netFocus = null;  // sport key emphasized from a tile/legend hover

function isoDay(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function parseDay(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
function shortDay(s) { return parseDay(s).toLocaleDateString(undefined, { month: "short", day: "numeric" }); }
function signed(v) { return v > 0 ? "+" + v : String(v); }

function loadNetData() {
  return Promise.all(SPORTS.map(sport =>
    fetch(sport.histFile + "?_=" + Date.now()).then(r => r.ok ? r.json() : null).catch(() => null)
      .then(h => {
        const byDay = {};
        for (const [day, games] of Object.entries((h && h.days) || {})) {
          let w = 0, l = 0;
          for (const g of games || []) {
            const r = ((g.picks || {}).CONSENSUS || {}).result;
            if (r === "WIN") w++; else if (r === "LOSS") l++;
          }
          if (w || l) byDay[day] = { w, l };
        }
        return [sport.key, byDay];
      })
  )).then(entries => { netData = Object.fromEntries(entries); });
}

// Cumulative net per sport, one point per calendar day in the range, starting from 0.
function netSeries() {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const allDays = Object.values(netData).flatMap(m => Object.keys(m)).sort();
  const range = NET_RANGES.find(r => r.key === netRange);
  let start;
  if (range.days) { start = new Date(today); start.setDate(start.getDate() - (range.days - 1)); }
  else {
    start = allDays.length ? parseDay(allDays[0]) : new Date(today);
    start.setDate(start.getDate() - 1);  // begin at 0, the day before the first graded day
  }
  const days = [];
  for (let d = new Date(start); d <= today; d.setDate(d.getDate() + 1)) days.push(isoDay(d));
  const series = SPORTS.map((sport, i) => {
    const m = netData[sport.key] || {};
    let net = 0, w = 0, l = 0;
    const values = days.map(day => {
      const rec = m[day];
      if (rec) { net += rec.w - rec.l; w += rec.w; l += rec.l; }
      return net;
    });
    return { sport, color: `var(--series-${i + 1})`, values, byDay: m, w, l, graded: days.some(d => m[d]) };
  });
  return { days, series };
}

function renderNetTiles(series) {
  const tiles = document.querySelector("#net-card .net-tiles");
  tiles.innerHTML = "";
  for (const s of series) {
    const btn = document.createElement("button");
    btn.className = "net-tile" + (netFocus && netFocus !== s.sport.key ? " dimmed" : "");
    btn.type = "button";
    btn.dataset.sport = s.sport.key;
    const total = s.w + s.l;
    btn.innerHTML = `<div class="tile-label"><i style="background:${s.color}"></i></div>
      <div class="tile-value"></div><div class="tile-meta"></div>`;
    btn.querySelector(".tile-label").append(s.sport.label);
    btn.querySelector(".tile-value").textContent = s.graded ? signed(s.w - s.l) : "N/A";
    btn.querySelector(".tile-meta").textContent = s.graded
      ? `${s.w}-${s.l} · ${Math.round((s.w / total) * 100)}% ATS` : "No graded games";
    btn.addEventListener("pointerenter", () => setNetFocus(s.sport.key));
    btn.addEventListener("pointerleave", () => setNetFocus(null));
    btn.addEventListener("focus", () => setNetFocus(s.sport.key));
    btn.addEventListener("blur", () => setNetFocus(null));
    tiles.appendChild(btn);
  }
}

// Emphasis: the focused sport keeps full strength (plus a 10% area wash); the rest fade.
function setNetFocus(key) {
  netFocus = key;
  const card = document.getElementById("net-card");
  if (!card) return;
  card.querySelectorAll("[data-sport]").forEach(el => {
    const dim = key && el.dataset.sport !== key;
    if (el.classList.contains("net-tile")) el.classList.toggle("dimmed", !!dim);
    else el.classList.toggle("faded", !!dim);
    if (el.classList.contains("net-area")) el.classList.toggle("on", el.dataset.sport === key);
  });
}

function renderNetChart(animate = false) {
  const card = document.getElementById("net-card");
  if (!card || !netData) return;
  const { days, series } = netSeries();
  renderNetTiles(series);
  const plot = card.querySelector(".net-plot");
  const W = Math.max(280, plot.clientWidth), H = 260;
  const m = { top: 12, right: 96, bottom: 28, left: 36 };
  const iw = W - m.left - m.right, ih = H - m.top - m.bottom;
  const all = series.filter(s => s.graded).flatMap(s => s.values).concat([0]);
  let lo = Math.min(...all), hi = Math.max(...all);
  if (lo === hi) { lo -= 1; hi += 1; }
  const step = [1, 2, 5, 10, 20, 50, 100].find(st => (hi - lo) / st <= 6) || 100;
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const x = i => m.left + (days.length > 1 ? (i / (days.length - 1)) * iw : iw / 2);
  const y = v => m.top + (1 - (v - lo) / (hi - lo)) * ih;

  let svg = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Net wins over time by sport"><defs>`;
  series.forEach((s, i) => {
    svg += `<linearGradient id="net-wash-${i}" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="${s.color}" stop-opacity="0.18"/><stop offset="1" stop-color="${s.color}" stop-opacity="0.02"/></linearGradient>`;
  });
  svg += `</defs>`;
  // recessive solid hairline grid; the zero line one step stronger
  for (let v = lo; v <= hi + 1e-9; v += step) {
    svg += `<line x1="${m.left}" x2="${m.left + iw}" y1="${y(v)}" y2="${y(v)}" stroke="${v === 0 ? "#3a3f4b" : "#22252d"}" stroke-width="1"/>`;
    svg += `<text x="${m.left - 8}" y="${y(v) + 4}" text-anchor="end">${signed(v)}</text>`;
  }
  const ticks = Math.max(2, Math.min(6, days.length, Math.floor(iw / 70)));  // ~70px per date label
  for (let t = 0; t < ticks; t++) {
    const i = ticks === 1 ? 0 : Math.round(t * (days.length - 1) / (ticks - 1));
    svg += `<text x="${x(i)}" y="${H - 8}" text-anchor="${t === 0 ? "start" : t === ticks - 1 ? "end" : "middle"}">${shortDay(days[i])}</text>`;
  }
  // per-sport area wash (shown only when that sport is focused), then the 2px lines
  series.forEach((s, i) => {
    if (!s.graded) return;
    const pts = s.values.map((v, j) => `${x(j)},${y(v)}`).join(" L");
    svg += `<path class="net-area" data-sport="${s.sport.key}" d="M${x(0)},${y(0)} L${pts} L${x(days.length - 1)},${y(0)} Z" fill="url(#net-wash-${i})"/>`;
  });
  series.forEach(s => {
    if (!s.graded) return;
    const pts = s.values.map((v, j) => `${x(j)},${y(v)}`).join(" L");
    svg += `<path class="net-line" data-sport="${s.sport.key}" pathLength="1" d="M${pts}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  });
  // end dots (r 4, 2px surface ring) + end labels; colliding labels get a leader line
  const xEnd = x(days.length - 1);
  const ends = series.filter(s => s.graded).map(s => {
    const v = s.values[s.values.length - 1];
    return { s, v, ly: y(v), yy: y(v) };
  }).sort((a, b) => a.yy - b.yy);
  for (let i = 1; i < ends.length; i++) if (ends[i].yy - ends[i - 1].yy < 15) ends[i].yy = ends[i - 1].yy + 15;
  for (const e of ends) {
    const k = e.s.sport.key;
    if (Math.abs(e.yy - e.ly) > 1) {
      svg += `<path class="leader" data-sport="${k}" d="M${xEnd + 6},${e.ly} L${xEnd + 12},${e.yy}" stroke="#5b6170" stroke-width="1" fill="none"/>`;
    }
    svg += `<circle class="net-end" data-sport="${k}" cx="${xEnd}" cy="${e.ly}" r="4" fill="${e.s.color}" stroke="#17181d" stroke-width="2"/>`;
    svg += `<text class="end-label" data-sport="${k}" x="${xEnd + 15}" y="${e.yy + 4}">${e.s.sport.label} ${signed(e.v)}</text>`;
  }
  svg += `<line class="net-cross" x1="0" x2="0" y1="${m.top}" y2="${m.top + ih}" stroke="#5b6170" stroke-width="1" visibility="hidden"/>`;
  svg += `<g class="net-dots"></g>`;
  svg += `<rect class="net-hit" x="${m.left}" y="${m.top}" width="${iw}" height="${ih}" fill="transparent"/></svg>`;
  plot.classList.toggle("draw", animate);
  plot.innerHTML = svg + `<div class="net-tip"></div>`;

  // legend (line keys); hovering an entry focuses that sport
  const legend = card.querySelector(".net-legend");
  legend.innerHTML = "";
  for (const s of series) {
    const item = document.createElement("span");
    item.innerHTML = `<i style="background:${s.color}"></i>`;
    item.append(s.sport.label);
    if (!s.graded) { const note = document.createElement("span"); note.className = "muted"; note.textContent = "(no graded games)"; item.append(" ", note); }
    else {
      item.addEventListener("pointerenter", () => setNetFocus(s.sport.key));
      item.addEventListener("pointerleave", () => setNetFocus(null));
    }
    legend.appendChild(item);
  }

  // table view: the same numbers without hovering
  card.querySelector(".net-table tbody").innerHTML = series.map(s =>
    `<tr><td>${s.sport.label}</td><td>${s.w}-${s.l}</td><td class="perf-pct">${signed(s.w - s.l)}</td></tr>`
  ).join("");

  // hover: crosshair snaps to the nearest day; one tooltip lists every sport
  const svgEl = plot.querySelector("svg"), tip = plot.querySelector(".net-tip");
  const cross = svgEl.querySelector(".net-cross"), dots = svgEl.querySelector(".net-dots");
  const hit = svgEl.querySelector(".net-hit");
  const show = evt => {
    const rect = svgEl.getBoundingClientRect();
    const px = (evt.clientX - rect.left) * (W / rect.width);
    const i = Math.max(0, Math.min(days.length - 1, Math.round(((px - m.left) / iw) * (days.length - 1))));
    cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i)); cross.setAttribute("visibility", "visible");
    dots.innerHTML = series.filter(s => s.graded).map(s =>
      `<circle cx="${x(i)}" cy="${y(s.values[i])}" r="4" fill="${s.color}" stroke="#17181d" stroke-width="2"/>`).join("");
    tip.innerHTML = "";
    const head = document.createElement("div"); head.className = "tip-date";
    head.textContent = parseDay(days[i]).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
    tip.appendChild(head);
    for (const s of series.filter(s => s.graded)) {
      const row = document.createElement("div"); row.className = "tip-row";
      const key = document.createElement("i"); key.style.background = s.color;
      const val = document.createElement("span"); val.className = "tip-val"; val.textContent = signed(s.values[i]);
      const name = document.createElement("span"); name.textContent = s.sport.label;
      const rec = s.byDay[days[i]];
      const day = document.createElement("span"); day.className = "tip-day";
      day.textContent = rec ? `${rec.w}-${rec.l} that day` : "";
      row.append(key, val, name, day);
      tip.appendChild(row);
    }
    tip.style.display = "block";
    const left = (x(i) / W) * rect.width;
    tip.style.left = Math.min(Math.max(0, left + 14), rect.width - tip.offsetWidth) + "px";
    tip.style.top = "4px";
  };
  const hide = () => { tip.style.display = "none"; cross.setAttribute("visibility", "hidden"); dots.innerHTML = ""; };
  hit.addEventListener("pointermove", show);
  hit.addEventListener("pointerleave", hide);
  setNetFocus(netFocus);
}

function selectNetRange(key) {
  netRange = key;
  document.querySelectorAll("#net-card .range-btn").forEach(b => b.classList.toggle("active", b.dataset.range === key));
  renderNetChart(true);
}

function netCardHtml() {
  return `
    <div class="perf-card net-card" id="net-card">
      <div class="net-head">
        <div class="seg" role="group" aria-label="Time range">${NET_RANGES.map(r =>
          `<button class="range-btn${r.key === netRange ? " active" : ""}" data-range="${r.key}" onclick="selectNetRange('${r.key}')">${r.label}</button>`).join("")}
        </div>
        <h2>Net Wins Over Time</h2>
        <div class="net-sub">Consensus picks against the spread: running wins minus losses by sport.</div>
      </div>
      <div class="net-tiles"></div>
      <div class="net-legend"></div>
      <div class="net-plot"></div>
      <details class="net-table">
        <summary>View as table</summary>
        <table class="perf"><thead><tr><th>Sport</th><th>Record</th><th>Net</th></tr></thead><tbody></tbody></table>
      </details>
    </div>`;
}

window.addEventListener("resize", () => { if (currentView === "performance") renderNetChart(false); });

function loadPerformance() {
  const container = document.getElementById("performance");
  container.innerHTML = '<div class="empty-state">Loading&hellip;</div>';
  Promise.all(SPORTS.map(sport =>
    fetch(sport.perfFile + "?_=" + Date.now())
      .then(r => r.ok ? r.json() : null)
      .catch(() => null)
      .then(data => ({ sport, data }))
  )).then(results => {
    perfResults = results;
    if (!perfSport) perfSport = currentSport;
    container.innerHTML = netCardHtml() + perfCardHtml();
    selectPerfSport(perfSport);
    loadNetData().then(() => renderNetChart(true));
  });
}

// ---- History tab: one graded day at a time, per sport (from <sport>_history.json) ----
let historySport = null;
let historyData = null;
let historyDate = null;
let historyRuns = [];   // that day's saved runs (days/<sport>/<date>.json), if any
let historyRun = "graded";  // "graded" (each game's last run before kickoff) or an index into historyRuns
let historyGames = [];  // games currently rendered in History (for the detail dropdowns)

function selectHistory() {
  currentView = "history";
  renderTabs();
  setViewVisibility();
  loadHistory(historySport || currentSport);
}

function historyDays() {
  const days = (historyData && historyData.days) || {};
  return Object.keys(days).filter(d => (days[d] || []).length).sort().reverse();
}

function fmtDate(d) {
  const [y, m, day] = d.split("-").map(Number);
  return new Date(y, m - 1, day).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric", year: "numeric" });
}

function loadHistory(key) {
  historySport = key;
  historyData = null;
  const sport = SPORTS.find(s => s.key === key);
  document.getElementById("history").innerHTML = '<div class="empty-state">Loading&hellip;</div>';
  fetch(sport.histFile + "?_=" + Date.now())
    .then(r => r.ok ? r.json() : null)
    .catch(() => null)
    .then(data => {
      historyData = data;
      const days = historyDays();
      if (!days.includes(historyDate)) historyDate = days[0] || null;
      loadHistoryRuns();
    });
}

function selectHistoryDate(d) {
  historyDate = d;
  loadHistoryRuns();
}

function loadHistoryRuns() {
  historyRuns = [];
  historyRun = "graded";
  renderHistory();
  if (!historyDate) return;
  const sport = historySport, date = historyDate;
  fetch(`days/${sport}/${date}.json?_=` + Date.now())
    .then(r => r.ok ? r.json() : null)
    .catch(() => null)
    .then(data => {
      if (sport !== historySport || date !== historyDate) return;  // user moved on meanwhile
      historyRuns = (data && data.snapshots) || [];
      renderHistory();
    });
}

function selectHistoryRun(v) {
  historyRun = v === "graded" ? "graded" : parseInt(v, 10);
  renderHistory();
}

function resultTag(result) {
  if (result === "WIN") return '<span class="tag agree">WIN</span>';
  if (result === "LOSS") return '<span class="tag disagree">LOSS</span>';
  return "";
}

function renderHistoryGame(g) {
  const picks = g.picks || {};
  const c = picks.CONSENSUS || {};
  const modelRows = Object.entries(picks).filter(([k]) => k !== "CONSENSUS" && k !== SHARP_KEY).map(([k, p]) =>
    `<tr><td>${k}</td><td>${p.pick || "N/A"}${resultTag(p.result)}</td></tr>`
  ).join("");
  const final = g.final ? ` &middot; Final: ${g.final}` : "";
  const statusTag = g.status ? `<span class="tag neutral">${g.status.split(" (")[0]}</span>` : resultTag(c.result);
  const sharpGame = { ...g, detail: { "M6: Sharp Money": g.sharp || {} } };
  return `
    <div class="game-card">
      <div class="game-header" onclick="this.closest('.game-card').classList.toggle('expanded')">
        <div class="game-title-row">
          <div>
            <div class="game-title">${g.game || ""}</div>
            <div class="game-meta">Line: ${g.line || "N/A"}${final}</div>
          </div>
          <span class="chevron">&#9654;</span>
        </div>
        <div class="consensus-row">
          <div>
            <div class="consensus-label">Consensus</div>
            <div class="consensus-pick">${c.pick || "N/A"}${statusTag}</div>
          </div>
          <div class="confidence-badge">${g.confidence || "N/A"}</div>
        </div>
        ${renderSharpRow(sharpGame, g.cover)}
      </div>
      <div class="models-wrap">
        <table class="models">${modelRows}</table>
      </div>
    </div>
  `;
}

function renderHistory() {
  const sport = SPORTS.find(s => s.key === historySport);
  const days = historyDays();
  const sportOpts = SPORTS.map(s => `<option value="${s.key}"${s.key === historySport ? " selected" : ""}>${s.label}</option>`).join("");
  const dateOpts = days.length
    ? days.map(d => `<option value="${d}"${d === historyDate ? " selected" : ""}>${fmtDate(d)}</option>`).join("")
    : "<option>No graded days</option>";
  const runOpts = `<option value="graded"${historyRun === "graded" ? " selected" : ""}>Graded</option>` + historyRuns.map((r, i) =>
    `<option value="${i}"${i === historyRun ? " selected" : ""}>${new Date(r.time).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" })}</option>`
  ).join("");
  const controls = `
    <div class="controls-row">
      <select class="runtime-select" onchange="loadHistory(this.value)">${sportOpts}</select>
      <select class="runtime-select" onchange="selectHistoryDate(this.value)"${days.length ? "" : " disabled"}>${dateOpts}</select>
      ${historyRuns.length ? `<select class="runtime-select" onchange="selectHistoryRun(this.value)" title="Run time">${runOpts}</select>` : ""}
    </div>`;
  const container = document.getElementById("history");
  if (!days.length) {
    container.innerHTML = controls + `<div class="empty-state">No graded ${sport.label} games yet.</div>`;
    return;
  }
  const gradedGames = historyData.days[historyDate] || [];
  const run = historyRun === "graded" ? null : historyRuns[historyRun];

  // Graded view: each game exactly as it looked in the run that was graded (its last run
  // before kickoff). Games graded from the morning file (no saved run) use the simple card.
  if (historyRun === "graded" && historyRuns.length) {
    historyGames = [];
    const cards = gradedGames.map(h => {
      const snap = h.graded_run && historyRuns.find(r => r.time === h.graded_run);
      const g = snap && (snap.games || []).find(x => x.team_home === h.team_home && x.team_away === h.team_away);
      if (!g) return renderHistoryGame(h);
      historyGames.push(g);
      return renderGame(g, historyGames.length - 1,
        { cover: h.cover, final: h.final, status: h.status, run: h.graded_run }, "history");
    });
    const results = gradedGames.map(g => (g.picks && g.picks.CONSENSUS || {}).result);
    container.innerHTML = controls + dayRecordBar(results, gradedGames.length,
      "Each game as of its last run before kickoff, which is what was graded.") + cards.join("");
    return;
  }

  // Days from before runs were saved only have the graded morning picks.
  if (!run) {
    historyGames = [];
    const results = gradedGames.map(g => (g.picks && g.picks.CONSENSUS || {}).result);
    container.innerHTML = controls + dayRecordBar(results, gradedGames.length,
      "Run-by-run snapshots weren't saved for this day, so this shows the graded morning picks.")
      + gradedGames.map(renderHistoryGame).join("");
    return;
  }

  // A saved run: the exact cards the Games view showed at that time, plus the grade.
  historyGames = run.games || [];
  const grades = historyGames.map(g => {
    const h = gradedGames.find(x => x.team_home === g.team_home && x.team_away === g.team_away);
    return h ? { cover: h.cover, final: h.final, status: h.status } : { status: "Not graded" };
  });
  const results = historyGames.map((g, i) => {
    const c = (g.picks || {}).CONSENSUS || "";
    if (!grades[i].cover || !c.startsWith("TAKE:")) return null;
    return c.replace("TAKE:", "").trim() === grades[i].cover ? "WIN" : "LOSS";
  });
  container.innerHTML = controls + dayRecordBar(results, historyGames.length,
    `Showing the ${fmtTime(run.time)} run, graded against final scores.`)
    + historyGames.map((g, i) => renderGame(g, i, grades[i], "history")).join("");
}

function dayRecordBar(results, count, note) {
  const w = results.filter(r => r === "WIN").length;
  const l = results.filter(r => r === "LOSS").length;
  const pct = w + l ? ` (${Math.round(w / (w + l) * 100)}%)` : "";
  return `
    <div class="status-bar">
      <span>Consensus: <span class="hist-record">${w}-${l}</span>${pct}</span>
      <span>${count} ${count === 1 ? "game" : "games"}</span>
    </div>
    <div class="hist-note">${note}</div>`;
}

(function init() {
  let saved = null;
  try { saved = localStorage.getItem("wagrx-last-sport"); } catch (e) {}
  if (saved && SPORTS.some(s => s.key === saved)) currentSport = saved;
  renderTabs();
  setViewVisibility();
  loadSport(currentSport);
})();
</script>
