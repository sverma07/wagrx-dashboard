<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WagrX Dashboard</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card-bg: #ffffff;
    --text: #1a1d23;
    --text-dim: #6b7280;
    --border: #e3e5e9;
    --accent: #2563eb;
    --win: #15803d;
    --win-bg: #dcfce7;
    --loss: #b91c1c;
    --loss-bg: #fee2e2;
    --neutral-bg: #f1f2f4;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15171c;
      --card-bg: #1e2128;
      --text: #e8e9ec;
      --text-dim: #9199a8;
      --border: #30343d;
      --accent: #5b8def;
      --win: #4ade80;
      --win-bg: #14532d;
      --loss: #f87171;
      --loss-bg: #7f1d1d;
      --neutral-bg: #2a2e37;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15171c;
    --card-bg: #1e2128;
    --text: #e8e9ec;
    --text-dim: #9199a8;
    --border: #30343d;
    --accent: #5b8def;
    --win: #4ade80;
    --win-bg: #14532d;
    --loss: #f87171;
    --loss-bg: #7f1d1d;
    --neutral-bg: #2a2e37;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 16px;
  }
  .wrap { max-width: 780px; margin: 0 auto; }
  header { margin-bottom: 20px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px 0; }
  .subtitle { color: var(--text-dim); font-size: 0.9rem; }
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
    padding: 10px 14px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 0.85rem;
    color: var(--text-dim);
  }
  .game-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .game-title { font-weight: 600; font-size: 1.02rem; margin-bottom: 2px; }
  .game-meta { color: var(--text-dim); font-size: 0.85rem; margin-bottom: 12px; }
  .consensus-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--neutral-bg);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 12px;
  }
  .consensus-label { font-size: 0.78rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; }
  .consensus-pick { font-weight: 700; font-size: 1rem; }
  .confidence-badge {
    font-weight: 700;
    font-size: 0.95rem;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
  }
  table.models { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  table.models td { padding: 6px 4px; border-top: 1px solid var(--border); }
  table.models td:first-child { color: var(--text-dim); width: 42%; }
  .tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 0.78rem;
    font-weight: 600;
    margin-left: 6px;
  }
  .tag.agree { background: var(--win-bg); color: var(--win); }
  .tag.disagree { background: var(--loss-bg); color: var(--loss); }
  .empty-state { color: var(--text-dim); text-align: center; padding: 40px 16px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>WagrX: NCAAF</h1>
    <div class="subtitle">Model consensus for today's games</div>
    <div class="status-bar">
      <span id="updated-at">Loading&hellip;</span>
      <span id="game-count"></span>
    </div>
  </header>
  <main id="games"></main>
</div>

<script>
function fmtTime(iso) {
  if (!iso) return "never run yet";
  try {
    const d = new Date(iso);
    return d.toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
  } catch (e) {
    return iso;
  }
}

function renderGame(g) {
  const modelRows = Object.entries(g.models || {})
    .filter(([key]) => key !== "CONSENSUS" && key !== "CONFIDENCE")
    .map(([key, pick]) => {
      const consensusPick = (g.models && g.models.CONSENSUS) || "";
      let tag = "";
      if (pick && pick.startsWith("TAKE:") && consensusPick && consensusPick.startsWith("TAKE:")) {
        tag = pick === consensusPick
          ? '<span class="tag agree">AGREE</span>'
          : '<span class="tag disagree">DISAGREE</span>';
      }
      const label = pick ? pick.replace("TAKE: ", "") : "N/A";
      return `<tr><td>${key}</td><td>${label}${tag}</td></tr>`;
    }).join("");

  const consensus = (g.models && g.models.CONSENSUS) ? g.models.CONSENSUS.replace("TAKE: ", "") : "N/A";
  const confidence = g.confidence || "N/A";

  return `
    <div class="game-card">
      <div class="game-title">${g.game || ""}</div>
      <div class="game-meta">Line: ${g.spread || "N/A"} &middot; Favorite: ${g.favorite || "N/A"}</div>
      <div class="consensus-row">
        <div>
          <div class="consensus-label">Consensus</div>
          <div class="consensus-pick">${consensus}</div>
        </div>
        <div class="confidence-badge">${confidence}</div>
      </div>
      <table class="models">${modelRows}</table>
    </div>
  `;
}

fetch("ncaaf.json?_=" + Date.now())
  .then(r => r.json())
  .then(data => {
    document.getElementById("updated-at").textContent = "Last updated: " + fmtTime(data.generated_at);
    const games = data.games || [];
    document.getElementById("game-count").textContent = games.length + (games.length === 1 ? " game" : " games");
    const container = document.getElementById("games");
    if (games.length === 0) {
      container.innerHTML = '<div class="empty-state">No games loaded yet. Check back after the next run.</div>';
      return;
    }
    container.innerHTML = games.map(renderGame).join("");
  })
  .catch(err => {
    document.getElementById("updated-at").textContent = "Could not load data.";
    console.error(err);
  });
</script>
</body>
</html>
