// ---- Performance: combination explorer. Consensus record for games matching a mix of signals, using the
// picks saved with each graded game (so it needs no extra data). "Aligned" = the signal picked the same team as consensus.
const COMBO_MIN_GAMES = 5;
const COMBO_DIMS = [
  { key: "sharp", label: "Sharps", opts: [["aligned", "Aligned"], ["against", "Against"], ["none", "No read"]] },
  { key: "line", label: "Line movement", opts: [["aligned", "Aligned"], ["against", "Against"], ["none", "No read"]] },
  { key: "conf", label: "Min confidence", slider: true },
  { key: "side", label: "Consensus pick is", opts: [["fav", "Favorite"], ["dog", "Underdog"]] },
];
const COMBO_ANY = { sharp: "any", line: "any", conf: "any", side: "any" };
let comboSel = { ...COMBO_ANY };

// Confidence rounded to a whole number (not truncated), so 79.6 counts as 80 for the combination threshold.
function comboConf(v) { return Math.round(parseFloat(v)); }

function comboTeam(p) {
  p = p && p.pick ? String(p.pick) : "";
  p = p.replace(/^TAKE:/, "").trim();
  return !p || p === "N/A" || p === "PUSH" ? null : p;
}

// The combination facts for one graded game, computed once and cached on it.
function comboFacts(x) {
  if (x.f) return x.f;
  const picks = x.picks || {};
  const cons = comboTeam(picks.CONSENSUS);
  const votes = {};
  for (const src of SHARP_SOURCES) { const t = comboTeam(picks[src.pick]); if (t) votes[t] = (votes[t] || 0) + 1; }
  const ranked = Object.entries(votes).sort((a, b) => b[1] - a[1]);
  const sharpTeam = ranked.length && ranked[0][1] >= 2 && (ranked.length === 1 || ranked[0][1] > ranked[1][1]) ? ranked[0][0] : null;
  const lineTeam = comboTeam(picks[LINE_MOVE_KEY]);
  const vs = t => !cons || !t ? "none" : t === cons ? "aligned" : "against";
  const fav = String(x.fav || "").replace(/\s*-fav\s*$/, "").trim();
  return (x.f = {
    sharp: vs(sharpTeam), line: vs(lineTeam),
    conf: Number(x.conf),
    side: !cons || !fav ? "none" : cons === fav ? "fav" : "dog",
  });
}

// Confidence is a minimum threshold (slider); the other signals are exact-match buttons.
function comboMatch(f, sel) {
  return COMBO_DIMS.every(d => sel[d.key] === "any" || (d.slider ? f[d.key] >= sel[d.key] : f[d.key] === sel[d.key]));
}

// Whole-number confidence values seen in the graded games (the slider's range and the best search's candidates).
function comboConfLevels(games) {
  const set = new Set();
  for (const x of games) { const c = comboFacts(x).conf; if (!isNaN(c)) set.add(Math.floor(c)); }
  return [...set].sort((a, b) => a - b);
}

function comboRecord(games, sel) {
  let w = 0, l = 0;
  for (const x of games) {
    const f = comboFacts(x);
    if (!comboMatch(f, sel)) continue;
    if (x.result === "WIN") w++; else l++;
  }
  return { w, l, n: w + l };
}

// Lower bound of the 95% Wilson interval: a win rate discounted when the sample is small,
// so 3-0 does not outrank 18-7.
function wilsonLow(w, n) {
  if (!n) return 0;
  const z = 1.96, p = w / n, d = 1 + z * z / n;
  return (p + z * z / (2 * n) - z * Math.sqrt((p * (1 - p) + z * z / (4 * n)) / n)) / d;
}

function comboLabel(sel) {
  const parts = COMBO_DIMS.filter(d => sel[d.key] !== "any").map(d =>
    d.slider ? `${d.label}: ${sel[d.key]}%+` : `${d.label}: ${d.opts.find(([v]) => v === sel[d.key])[1]}`);
  return parts.length ? parts.join(" &middot; ") : "All graded games";
}

// The best combination must actually be a filter (pick fewer games than no filter) and beat both a coin flip and the
// all-games win rate; otherwise there is no best combination to show.
function bestCombo(games) {
  let best = null;
  // Thresholds are searched in steps of 5 so the best cutoff does not jitter by a point (70, 75, 80, ...).
  const levels = comboConfLevels(games).filter(c => c % 5 === 0);
  const base = comboRecord(games, COMBO_ANY), baseRate = base.n ? base.w / base.n : 0;
  const walk = (i, sel) => {
    if (i === COMBO_DIMS.length) {
      if (COMBO_DIMS.every(d => sel[d.key] === "any")) return;
      const r = comboRecord(games, sel);
      if (r.n < COMBO_MIN_GAMES || r.n === base.n) return;
      const rate = r.w / r.n;
      if (rate <= 0.5 || rate <= baseRate) return;
      const score = wilsonLow(r.w, r.n);
      if (!best || score > best.score || (score === best.score && r.n > best.n)) best = { sel: { ...sel }, ...r, score };
      return;
    }
    const d = COMBO_DIMS[i];
    for (const v of ["any", ...(d.slider ? levels : d.opts.map(o => o[0]))]) walk(i + 1, { ...sel, [d.key]: v });
  };
  walk(0, {});
  return best;
}

function setCombo(key, val) { comboSel[key] = val; renderCombo(); }
function applyBestCombo() { const b = bestCombo(histGames[perfSport] || []); if (b) { comboSel = { ...b.sel }; renderCombo(); } }
function setComboConf(v) {
  const levels = comboConfLevels(histGames[perfSport] || []);
  v = Number(v);
  comboSel.conf = !levels.length || v <= levels[0] ? "any" : v;
  renderComboLive();
}
function resetCombo() { comboSel = { ...COMBO_ANY }; renderCombo(); }

function comboRateClass(w, n) {
  const r = n ? w / n : 0.5;
  return r > 0.5 ? "up" : r < 0.5 ? "down" : "";
}

function comboBestHtml(games) {
  const best = bestCombo(games), all = comboRecord(games, COMBO_ANY);
  const isBest = best && COMBO_DIMS.every(d => comboSel[d.key] === best.sel[d.key]);
  return best
    ? `<div class="combo-best"><div class="combo-best-label">Best combination so far</div>
        <div class="combo-best-main"><span class="combo-best-desc">${comboLabel(best.sel)}</span>
        <span class="combo-best-rec ${comboRateClass(best.w, best.n)}">${best.w}-${best.l} (${Math.round(best.w / best.n * 100)}%)</span></div>
        ${isBest ? "" : '<button type="button" class="combo-apply" onclick="applyBestCombo()">Show this combination</button>'}</div>`
    : `<div class="combo-best"><div class="combo-best-label">Best combination so far</div>
        <div class="combo-meta">${all.n < COMBO_MIN_GAMES
          ? `Needs a combination with at least ${COMBO_MIN_GAMES} graded games.`
          : `No combination is beating the overall record yet (${all.w}-${all.l}, ${Math.round(all.w / all.n * 100)}%).`}</div></div>`;
}

function comboResultHtml(games) {
  const r = comboRecord(games, comboSel), all = comboRecord(games, COMBO_ANY);
  const pct = r.n ? Math.round(r.w / r.n * 100) : null;
  return `<div class="combo-result"><span class="combo-rec">${r.n ? r.w + "-" + r.l : "N/A"}</span>
      <span class="combo-pct ${r.n ? comboRateClass(r.w, r.n) : ""}">${pct === null ? "" : pct + "%"}</span>
      <span class="combo-meta">${r.n} game${r.n === 1 ? "" : "s"}${r.n && r.n < COMBO_MIN_GAMES ? " (small sample)" : ""} &middot; all games: ${all.w}-${all.l}</span></div>
      ${r.n ? `<div class="combo-bar"><i style="width:${pct}%"></i></div>` : ""}`;
}

// Slider drag: refresh only the best box, the value label and the result so the slider keeps its drag.

function comboCardHtml() {

    <div class="perf-card">

// ---- Best combination: the Combination Explorer's current best pick of signals for a sport, shown as a banner at
// the top of that sport's tab and usable as a one-click filter on Games and Upcoming. Games here are live game
// objects (picks as plain "TAKE: Team" strings), so they are adapted to the shape the explorer grades.
const histGamesLoadedAt = {};  // sportKey -> ms when its graded games were last loaded
const bestCache = {};          // sportKey -> { games, n, best, all }

function comboFactsLive(g) {
  const picks = {};
  for (const [k, v] of Object.entries(g.picks || {})) picks[k] = { pick: v };
  return comboFacts({ picks, fav: g.favorite, conf: comboConf(g.confidence) });
}

// Graded games for a sport come from its history file, counted from its last reset (same as the Performance tab).
function ensureBestCombo(sportKey) {
  const fresh = histGames[sportKey] && Date.now() - (histGamesLoadedAt[sportKey] || 0) < 30 * 60000;
  if (fresh) return Promise.resolve();
  const sport = SPORTS.find(s => s.key === sportKey);
  return Promise.all([
    fetch(sport.histFile + "?_=" + Date.now()).then(r => r.ok ? r.json() : null).catch(() => null),
    fetch(sport.perfFile + "?_=" + Date.now()).then(r => r.ok ? r.json() : null).catch(() => null),
  ]).then(([h, perf]) => {
    const since = (perf && perf.since) || "";
    histGames[sportKey] = gradedGamesFrom(h, since).flat;
    histGamesLoadedAt[sportKey] = Date.now();
  });
}

function bestFor(sportKey) {
  const games = histGames[sportKey];
  if (!games) return null;  // not loaded yet
  const c = bestCache[sportKey];
  if (c && c.games === games && c.n === games.length) return c;
  return (bestCache[sportKey] = { games, n: games.length, best: bestCombo(games), all: comboRecord(games, COMBO_ANY) });
}

// The selection to filter by, or null when the sport has no best combination (then the filter does nothing).
function bestSelFor(sportKey) {
  const b = bestFor(sportKey);
  return b && b.best ? b.best.sel : null;
}

function bestMatches(sportKey, facts) {
  const sel = bestSelFor(sportKey);
  return !sel || comboMatch(facts, sel);
}

// The combination in plain words, one phrase per signal that is part of it.
function comboPhrase(sel) {
  const parts = [];
  const rel = { aligned: "with consensus", against: "against consensus" };
  if (sel.sharp !== "any") parts.push(sel.sharp === "none" ? "No sharp read" : `Sharps ${rel[sel.sharp]}`);
  if (sel.line !== "any") parts.push(sel.line === "none" ? "No line-move read" : `Line move ${rel[sel.line]}`);
  if (sel.conf !== "any") parts.push(`Confidence ${sel.conf}%+`);
  if (sel.side !== "any") parts.push(`Consensus on the ${sel.side === "fav" ? "favorite" : "underdog"}`);
  return parts.length ? parts.join(" &middot; ") : "All games";
}

function bestBannerHtml(sportKey) {
  const c = bestFor(sportKey);
  if (!c) return "";
  const sport = SPORTS.find(s => s.key === sportKey);
  const head = `Best combination &middot; ${sport.label}`;
  if (!c.best) {
    const msg = c.all.n < COMBO_MIN_GAMES
      ? `Needs a combination with at least ${COMBO_MIN_GAMES} graded games.`
      : `None beating the overall record yet (${c.all.w}-${c.all.l}, ${Math.round(c.all.w / c.all.n * 100)}%).`;
    return `<div class="best-banner"><span class="best-label">${head}</span><span class="best-none">${msg}</span></div>`;
  }
  const b = c.best;
  return `<div class="best-banner"><span class="best-label">${head}</span><span class="best-phrase">${comboPhrase(b.sel)}</span>`
    + `<span class="best-rec ${comboRateClass(b.w, b.n)}">${b.w}-${b.l} (${Math.round(b.w / b.n * 100)}%) <span class="best-n">${b.n} games</span></span></div>`;
}

function renderBestBanner() {
  const el = document.getElementById("best-banner");
  if (!el) return;
  el.innerHTML = currentView === "games" ? bestBannerHtml(currentSport) : "";
}

// Loads the sport's graded games, then redraws whatever depends on them (banner, filter button, filtered lists).
function refreshBest(sportKey) {
  ensureBestCombo(sportKey).then(() => {
    if (currentView === "games" && currentSport === sportKey) { renderBestBanner(); if (currentSnap) rerenderFiltered(); }
    else if (currentView === "upcoming" && upcomingSport === sportKey) renderUpcoming();
  });
}

function bestButtonHtml(scope) {
  const sportKey = scope === "upcoming" ? upcomingSport : currentSport;
  const ready = !!bestSelFor(sportKey);
  const on = ready && chipState(scope).best;
  const title = ready ? "Show only games matching the current best combination" : "No best combination for this sport yet";
  return `<button type="button" class="filter-toggle best-toggle${on ? " on" : ""}" aria-pressed="${on}" title="${title}"${ready ? "" : " disabled"} onclick="toggleBest('${scope}')">`
    + `<svg width="14" height="14" viewBox="0 0 24 24" fill="${on ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>Best combination</button>`;
}

function toggleBest(scope) {
  setChips(scope, "best", !chipState(scope).best);
}

// ---- Winning combination: every combination of the explorer's signals with a graded record above 50% (and at
// least COMBO_MIN_GAMES games). The filter keeps games that fit at least one; their cards say which and its record.
function allWinningCombos(games) {
  const out = [];
  const levels = comboConfLevels(games).filter(c => c % 5 === 0);
  const base = comboRecord(games, COMBO_ANY);
  const walk = (i, sel) => {
    if (i === COMBO_DIMS.length) {
      if (COMBO_DIMS.every(d => sel[d.key] === "any")) return;
      const r = comboRecord(games, sel);
      if (r.n < COMBO_MIN_GAMES || r.n === base.n || r.w / r.n <= 0.5) return;
      out.push({ sel: { ...sel }, ...r, score: wilsonLow(r.w, r.n) });
      return;
    }
    const d = COMBO_DIMS[i];
    for (const v of ["any", ...(d.slider ? levels : d.opts.map(o => o[0]))]) walk(i + 1, { ...sel, [d.key]: v });
  };
  walk(0, {});
  return out.sort((a, b) => b.score - a.score || b.n - a.n);
}

function winCombosFor(sportKey) {
  const c = bestFor(sportKey);
  if (!c) return [];
  return c.wins || (c.wins = allWinningCombos(c.games));
}

function winReady(sportKey) { return winCombosFor(sportKey).length > 0; }

// The winning combinations a game fits, best first.
function winMatchesFor(sportKey, facts) {
  return winCombosFor(sportKey).filter(c => comboMatch(facts, c.sel));
}

const WIN_CARD_MAX = 3;
function winCombosHtml(matches) {
  if (!matches || !matches.length) return "";
  const rows = matches.slice(0, WIN_CARD_MAX).map(c =>
    `<div class="win-combo"><span class="win-combo-phrase">${comboPhrase(c.sel)}</span>`
    + `<span class="win-combo-rec">${c.w}-${c.l} (${Math.round(c.w / c.n * 100)}%)</span></div>`).join("");
  const more = matches.length - WIN_CARD_MAX;
  return `<div class="win-combos"><div class="win-combos-label">Winning combination${matches.length > 1 ? "s" : ""}</div>${rows}`
    + (more > 0 ? `<div class="win-combo-more">+${more} more winning combination${more === 1 ? "" : "s"}</div>` : "") + `</div>`;
}

function winButtonHtml(scope) {
  const sportKey = scope === "upcoming" ? upcomingSport : currentSport;
  const ready = winReady(sportKey);
  const on = ready && chipState(scope).win;
  const title = ready ? "Show only games that fit a combination with a winning record (above 50%)" : "No winning combinations for this sport yet";
  return `<button type="button" class="filter-toggle best-toggle${on ? " on" : ""}" aria-pressed="${on}" title="${title}"${ready ? "" : " disabled"} onclick="toggleWin('${scope}')">`
    + `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4a2 2 0 0 1-2-2V5h4M18 9h2a2 2 0 0 0 2-2V5h-4M6 4h12v6a6 6 0 0 1-12 0zM12 16v4M8 20h8"/></svg>Winning combination</button>`;
}

function toggleWin(scope) {
  setChips(scope, "win", !chipState(scope).win);
}

// ---- Performance: net wins (consensus W minus L, against the spread) over time ----
const NET_RANGES = [{ key: "1w", label: "1W", days: 7 }, { key: "1m", label: "1M", days: 30 },
                    { key: "1y", label: "1Y", days: 365 }, { key: "all", label: "All", days: null }];
let netRange = "1m";
let histGames = {};   // sportKey -> [{ day, conf, result }] graded consensus picks since the reset
let netData = null;   // { sportKey: { "YYYY-MM-DD": { w, l } } }
let netFocus = null;  // sport key emphasized from a tile/legend hover

function isoDay(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function parseDay(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
function shortDay(s) { return parseDay(s).toLocaleDateString(undefined, { month: "short", day: "numeric" }); }
function signed(v) { return v > 0 ? "+" + v : String(v); }

// A sport's graded consensus games (and per-day W/L) from its history file, counted from `since`.
function gradedGamesFrom(h, since) {
  const byDay = {};
  const flat = [];
  for (const [day, games] of Object.entries((h && h.days) || {})) {
    if (day < since) continue;
    let w = 0, l = 0;
    for (const g of games || []) {
      const r = ((g.picks || {}).CONSENSUS || {}).result;
      if (r === "WIN") w++; else if (r === "LOSS") l++;
      if (r === "WIN" || r === "LOSS") flat.push({ day, conf: comboConf(g.confidence), result: r, picks: g.picks, fav: g.favorite });
    }
    if (w || l) byDay[day] = { w, l };
  }
  flat.sort((a, b) => a.day < b.day ? -1 : a.day > b.day ? 1 : 0);
  return { flat, byDay };
}

function loadNetData() {
  return Promise.all(SPORTS.map(sport =>
    fetch(sport.histFile + "?_=" + Date.now()).then(r => r.ok ? r.json() : null).catch(() => null)
      .then(h => {
        // Count from the sport's last stats reset, so the chart matches the Model Records table.
        const perf = (perfResults.find(x => x.sport.key === sport.key) || {}).data;
        const { flat, byDay } = gradedGamesFrom(h, (perf && perf.since) || "");
        histGames[sport.key] = flat;
        histGamesLoadedAt[sport.key] = Date.now();
        return [sport.key, byDay];
      })
  )).then(entries => { netData = Object.fromEntries(entries); });
}

// Cumulative net per sport, one point per calendar day in the range, starting from 0.
function netSeries() {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const allDays = Object.values(netData).flatMap(m => Object.keys(m)).sort();
  const range = NET_RANGES.find(r => r.key === netRange);
  let start;
  if (range.days) { start = new Date(today); start.setDate(start.getDate() - (range.days - 1)); }
  else {
    start = allDays.length ? parseDay(allDays[0]) : new Date(today);
    start.setDate(start.getDate() - 1);  // begin at 0, the day before the first graded day
  }
  const days = [];
  for (let d = new Date(start); d <= today; d.setDate(d.getDate() + 1)) days.push(isoDay(d));
  const series = SPORTS.map((sport, i) => {
    const m = netData[sport.key] || {};
    let net = 0, w = 0, l = 0;
    const values = days.map(day => {
      const rec = m[day];
      if (rec) { net += rec.w - rec.l; w += rec.w; l += rec.l; }
      return net;
    });
    return { sport, color: `var(--series-${i + 1})`, values, byDay: m, w, l, graded: days.some(d => m[d]) };
  });
  return { days, series };
}

function renderNetTiles(series) {
  const tiles = document.querySelector("#net-card .net-tiles");
  tiles.innerHTML = "";
  for (const s of series) {
    const btn = document.createElement("button");
    btn.className = "net-tile" + (netFocus && netFocus !== s.sport.key ? " dimmed" : "");
    btn.type = "button";
    btn.dataset.sport = s.sport.key;
    const total = s.w + s.l;
    btn.innerHTML = `<div class="tile-label"><i style="background:${s.color}"></i></div>
      <div class="tile-value"></div><div class="tile-meta"></div>`;
    btn.querySelector(".tile-label").append(s.sport.label);
    btn.querySelector(".tile-value").textContent = s.graded ? signed(s.w - s.l) : "N/A";
    btn.querySelector(".tile-meta").textContent = s.graded
      ? `${s.w}-${s.l} · ${Math.round((s.w / total) * 100)}% ATS` : "No graded games";
    btn.addEventListener("pointerenter", () => setNetFocus(s.sport.key));
    btn.addEventListener("pointerleave", () => setNetFocus(null));
    btn.addEventListener("focus", () => setNetFocus(s.sport.key));
    btn.addEventListener("blur", () => setNetFocus(null));
    tiles.appendChild(btn);
  }
}

// Emphasis: the focused sport keeps full strength (plus a 10% area wash); the rest fade.
function setNetFocus(key) {
  netFocus = key;
  const card = document.getElementById("net-card");
  if (!card) return;
  card.querySelectorAll("[data-sport]").forEach(el => {
    const dim = key && el.dataset.sport !== key;
    if (el.classList.contains("net-tile")) el.classList.toggle("dimmed", !!dim);
    else el.classList.toggle("faded", !!dim);
    if (el.classList.contains("net-area")) el.classList.toggle("on", el.dataset.sport === key);
  });
}

function renderNetChart(animate = false) {
  const card = document.getElementById("net-card");
  if (!card || !netData) return;
  const { days, series } = netSeries();
  renderNetTiles(series);
  const plot = card.querySelector(".net-plot");
  const W = Math.max(280, plot.clientWidth), H = 260;
  const m = { top: 12, right: 96, bottom: 28, left: 36 };
  const iw = W - m.left - m.right, ih = H - m.top - m.bottom;
  const all = series.filter(s => s.graded).flatMap(s => s.values).concat([0]);
  let lo = Math.min(...all), hi = Math.max(...all);
  if (lo === hi) { lo -= 1; hi += 1; }
  const step = [1, 2, 5, 10, 20, 50, 100].find(st => (hi - lo) / st <= 6) || 100;
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const x = i => m.left + (days.length > 1 ? (i / (days.length - 1)) * iw : iw / 2);
  const y = v => m.top + (1 - (v - lo) / (hi - lo)) * ih;

  let svg = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Net wins over time by sport"><defs>`;
  series.forEach((s, i) => {
    svg += `<linearGradient id="net-wash-${i}" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="${s.color}" stop-opacity="0.18"/><stop offset="1" stop-color="${s.color}" stop-opacity="0.02"/></linearGradient>`;
  });
  svg += `</defs>`;
  // recessive solid hairline grid; the zero line one step stronger
  for (let v = lo; v <= hi + 1e-9; v += step) {
    svg += `<line x1="${m.left}" x2="${m.left + iw}" y1="${y(v)}" y2="${y(v)}" stroke="${v === 0 ? "#3a3f4b" : "#22252d"}" stroke-width="1"/>`;
    svg += `<text x="${m.left - 8}" y="${y(v) + 4}" text-anchor="end">${signed(v)}</text>`;
  }
  const ticks = Math.max(2, Math.min(6, days.length, Math.floor(iw / 70)));  // ~70px per date label
  for (let t = 0; t < ticks; t++) {
    const i = ticks === 1 ? 0 : Math.round(t * (days.length - 1) / (ticks - 1));
    svg += `<text x="${x(i)}" y="${H - 8}" text-anchor="${t === 0 ? "start" : t === ticks - 1 ? "end" : "middle"}">${shortDay(days[i])}</text>`;
  }
  // per-sport area wash (shown only when that sport is focused), then the 2px lines
  series.forEach((s, i) => {
    if (!s.graded) return;
    const pts = s.values.map((v, j) => `${x(j)},${y(v)}`).join(" L");
    svg += `<path class="net-area" data-sport="${s.sport.key}" d="M${x(0)},${y(0)} L${pts} L${x(days.length - 1)},${y(0)} Z" fill="url(#net-wash-${i})"/>`;
  });
  series.forEach(s => {
    if (!s.graded) return;
    const pts = s.values.map((v, j) => `${x(j)},${y(v)}`).join(" L");
    svg += `<path class="net-line" data-sport="${s.sport.key}" pathLength="1" d="M${pts}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  });
  // end dots (r 4, 2px surface ring) + end labels; colliding labels get a leader line
  const xEnd = x(days.length - 1);
  const ends = series.filter(s => s.graded).map(s => {
    const v = s.values[s.values.length - 1];
    return { s, v, ly: y(v), yy: y(v) };
  }).sort((a, b) => a.yy - b.yy);
  for (let i = 1; i < ends.length; i++) if (ends[i].yy - ends[i - 1].yy < 15) ends[i].yy = ends[i - 1].yy + 15;
  for (const e of ends) {
    const k = e.s.sport.key;
    if (Math.abs(e.yy - e.ly) > 1) {
      svg += `<path class="leader" data-sport="${k}" d="M${xEnd + 6},${e.ly} L${xEnd + 12},${e.yy}" stroke="#5b6170" stroke-width="1" fill="none"/>`;
    }
    svg += `<circle class="net-end" data-sport="${k}" cx="${xEnd}" cy="${e.ly}" r="4" fill="${e.s.color}" stroke="#17181d" stroke-width="2"/>`;
    svg += `<text class="end-label" data-sport="${k}" x="${xEnd + 15}" y="${e.yy + 4}">${e.s.sport.label} ${signed(e.v)}</text>`;
  }
  svg += `<line class="net-cross" x1="0" x2="0" y1="${m.top}" y2="${m.top + ih}" stroke="#5b6170" stroke-width="1" visibility="hidden"/>`;
  svg += `<g class="net-dots"></g>`;
  svg += `<rect class="net-hit" x="${m.left}" y="${m.top}" width="${iw}" height="${ih}" fill="transparent"/></svg>`;
  plot.classList.toggle("draw", animate);
  plot.innerHTML = svg + `<div class="net-tip"></div>`;

  // legend (line keys); hovering an entry focuses that sport
  const legend = card.querySelector(".net-legend");
  legend.innerHTML = "";
  for (const s of series) {
    const item = document.createElement("span");
    item.innerHTML = `<i style="background:${s.color}"></i>`;
    item.append(s.sport.label);
    if (!s.graded) { const note = document.createElement("span"); note.className = "muted"; note.textContent = "(no graded games)"; item.append(" ", note); }
    else {
      item.addEventListener("pointerenter", () => setNetFocus(s.sport.key));
      item.addEventListener("pointerleave", () => setNetFocus(null));
    }
    legend.appendChild(item);
  }

  // table view: the same numbers without hovering
  card.querySelector(".net-table tbody").innerHTML = series.map(s =>
    `<tr><td>${s.sport.label}</td><td>${s.w}-${s.l}</td><td class="perf-pct">${signed(s.w - s.l)}</td></tr>`
  ).join("");

  // hover: crosshair snaps to the nearest day; one tooltip lists every sport
  const svgEl = plot.querySelector("svg"), tip = plot.querySelector(".net-tip");
  const cross = svgEl.querySelector(".net-cross"), dots = svgEl.querySelector(".net-dots");
  const hit = svgEl.querySelector(".net-hit");
  const show = evt => {
    const rect = svgEl.getBoundingClientRect();
    const px = (evt.clientX - rect.left) * (W / rect.width);
    const i = Math.max(0, Math.min(days.length - 1, Math.round(((px - m.left) / iw) * (days.length - 1))));
    cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i)); cross.setAttribute("visibility", "visible");
    dots.innerHTML = series.filter(s => s.graded).map(s =>
      `<circle cx="${x(i)}" cy="${y(s.values[i])}" r="4" fill="${s.color}" stroke="#17181d" stroke-width="2"/>`).join("");
    tip.innerHTML = "";
    const head = document.createElement("div"); head.className = "tip-date";
    head.textContent = parseDay(days[i]).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
    tip.appendChild(head);
    for (const s of series.filter(s => s.graded)) {
      const row = document.createElement("div"); row.className = "tip-row";
      const key = document.createElement("i"); key.style.background = s.color;
      const val = document.createElement("span"); val.className = "tip-val"; val.textContent = signed(s.values[i]);
      const name = document.createElement("span"); name.textContent = s.sport.label;
      const rec = s.byDay[days[i]];
      const day = document.createElement("span"); day.className = "tip-day";
      day.textContent = rec ? `${rec.w}-${rec.l} that day` : "";
      row.append(key, val, name, day);
      tip.appendChild(row);
    }
    tip.style.display = "block";
    const left = (x(i) / W) * rect.width;
    tip.style.left = Math.min(Math.max(0, left + 14), rect.width - tip.offsetWidth) + "px";
    tip.style.top = "4px";
  };
  const hide = () => { tip.style.display = "none"; cross.setAttribute("visibility", "hidden"); dots.innerHTML = ""; };
  hit.addEventListener("pointermove", show);
  hit.addEventListener("pointerleave", hide);
  setNetFocus(netFocus);
}

// ---- Upcoming tab: lines for the next 7 days per sport (lines only, no model picks), from <sport>_upcoming.json ----
let upcomingSport = null;      // set on first open (last choice, else the sport you were viewing)
const upcomingCache = {};      // sport key -> parsed file, or null when it could not be loaded
let upcomingGames = [];         // Games-style objects for the cards on screen, by index (the model dropdown reads these)
let upcomingQuery = "";         // team search text; kept across filter changes, reset when the sport changes
let upcomingTotal = 0;         // games in the file, and whether any filter is on (for the "Showing X of Y" note)
let upcomingFilterActive = false;

function selectUpcoming() {
  currentView = "upcoming";
  if (!upcomingSport) {
    let saved = null;
    try { saved = localStorage.getItem("wagrx-upcoming-sport"); } catch (e) {}
    upcomingSport = SPORTS.some(x => x.key === saved) ? saved : currentSport;
  }
  renderTabs();
  setViewVisibility();
  loadUpcoming();
}

function selectUpcomingSport(key) {
  upcomingSport = key;
  upcomingFilters.dates = [];
  upcomingQuery = "";
  try { localStorage.setItem("wagrx-upcoming-sport", key); } catch (e) {}
  loadUpcoming();
}

function etLabel(iso, opts) {
  const d = new Date(iso);
  return isNaN(d) ? "" : d.toLocaleString("en-US", { ...opts, timeZone: "America/New_York" });
}

// ET calendar day (YYYY-MM-DD), the same clock the kickoff times use.
function etDay(iso) {
  const d = new Date(iso);
  return isNaN(d) ? "" : d.toLocaleDateString("en-CA", { timeZone: "America/New_York" });
}

// The current line as the spread text the Games card expects ("<favorite> -2.5"), with its favorite label.
// home/away are the MODEL's team names: the line data uses ESPN's short names ("Kennesaw State") while the
// picks use the longer ones ("Kennesaw State Owls"), and the card matches the favorite against the picks.
function upcomingSpread(g, home, away) {
  const cur = g.current_home;
  if (cur === null || cur === undefined) return { spread: "N/A", favorite: "?" };
  if (cur === 0) return { spread: "PK", favorite: "?" };
  const fav = cur < 0 ? home : away;
  return { spread: `${fav} -${Math.abs(cur)}`, favorite: `${fav} -fav` };
}

// An Upcoming entry with model picks, shaped like a Games-tab game so renderGame can draw it.
// The line fields come from the live entry (refreshed every cycle); the picks are from the last full run.
function upcomingAsGame(g, keyNumbers) {
  const m = g.model;
  const { spread, favorite } = upcomingSpread(g, m.team_home, m.team_away);
  const hasLine = g.current_home !== null && g.current_home !== undefined;
  // The side the line moved toward, as the MODEL's team name so it can be compared with the consensus pick.
  // Matched by side (home/away), never by comparing name strings across the two sources.
  const side = g.toward_side || (g.toward === g.team_home ? "home" : g.toward === g.team_away ? "away" : null);
  const toward = side === "home" ? m.team_home : side === "away" ? m.team_away : null;
  return {
    game: m.game, spread, favorite, confidence: m.confidence,
    picks: { ...m.picks, [LINE_MOVE_KEY]: toward ? `TAKE: ${toward}` : (hasLine ? "PUSH" : "N/A") },
    detail: { ...m.detail, [LINE_MOVE_KEY]: hasLine ? { open_home: g.open_home, current_home: g.current_home } : null },
    team_home: m.team_home, team_away: m.team_away, start: g.start, sharp_books: m.sharp_books, keyNumbers,
  };
}

function renderUpcomingGame(g, keyNumbers, idx) {
  if (g.model) {
    const game = upcomingAsGame(g, keyNumbers);
    upcomingGames[idx] = game;
    const wins = upcomingFilters.win && winReady(upcomingSport) ? winMatchesFor(upcomingSport, comboFactsLive(game)) : null;
    return renderGame(game, idx, null, "upcoming", wins);
  }
  // Lines only: no model picks for this game (yet).
  const cur = g.current_home;
  const hasLine = cur !== null && cur !== undefined;
  const fav = !hasLine ? "not posted yet" : cur === 0 ? "PK" : cur < 0 ? `${g.team_home} ${cur}` : `${g.team_away} ${-cur}`;
  const time = etLabel(g.start, { hour: "numeric", minute: "2-digit" });
  const dayPrefix = upcomingFilters.sort === "start" ? "" : etLabel(g.start, { weekday: "short", month: "short", day: "numeric" }) + ", ";
  return `
    <div class="game-card static" data-search="${g.game.toLowerCase()}">
      <div class="game-header">
        <div class="game-title">${g.game}</div>
        <div class="game-meta">${dayPrefix}${time} ET &middot; Line: ${fav}</div>
        ${hasLine ? lineMoveBlock({ home: g.team_home, open: g.open_home, cur, toward: g.toward, keyNumbers }) : ""}
      </div>
    </div>`;
}

// Upcoming filters (separate from the Games/History set above; same look). Move size = |now - open| on the spread.
const UPCOMING_FILTERS = [
  { key: "sort", label: "Sort", def: "start", opts: [["start", "Start time"], ["move", "Biggest move"], ["consensus", "Consensus %"]] },
  { key: "key", label: "Key number", def: "all", opts: [["all", "All"], ["crossed", "Touched 3 or 7"]], needsKeyNumbers: true },
];
let upcomingFilters = Object.fromEntries(UPCOMING_FILTERS.map(d => [d.key, d.def]));
for (const k of CHIP_KEYS) upcomingFilters[k] = [];  // multi-select chip groups; empty = not filtering
try { Object.assign(upcomingFilters, JSON.parse(localStorage.getItem("wagrx-upcoming-filters") || "{}")); } catch (e) {}
for (const k of CHIP_KEYS) if (!Array.isArray(upcomingFilters[k])) upcomingFilters[k] = [];
upcomingFilters.best = upcomingFilters.best === true;
upcomingFilters.win = upcomingFilters.win === true;

// null = no line posted yet (never matches a move-size filter, sorts last by move)
function upcomingMoveSize(g) {
  return (g.current_home === null || g.current_home === undefined) ? null : Math.abs(g.current_home - g.open_home);
}
function upcomingConfidence(g) {
  const c = g.model ? parseInt(g.model.confidence, 10) : NaN;
  return isNaN(c) ? null : c;
}

function passesUpcomingFilters(g, hasKeyNumbers) {
  const f = upcomingFilters;
  if (f.dates.length && !f.dates.includes(etDay(g.start))) return false;
  if (!moveMatches(upcomingMoveSize(g), f.moves)) return false;
  if (!consMatches(upcomingConfidence(g), f.cons)) return false;
  // Games with no model picks have no sharp or signal read, so they only match "No data".
  const game = g.model ? upcomingAsGame(g, []) : null;
  if (f.best && bestSelFor(upcomingSport) && !(game && comboMatch(comboFactsLive(game), bestSelFor(upcomingSport)))) return false;
  if (f.win && winReady(upcomingSport) && !(game && winMatchesFor(upcomingSport, comboFactsLive(game)).length)) return false;
  if (!sharpTierMatches(game ? sharpFor(game, "best") : null, f.sharp)) return false;
  if (!signalsMatch(game ? signalFacts(game) : { cons: null, sharp: null, line: null }, f)) return false;
  if (hasKeyNumbers && f.key === "crossed" && !g.crosses_key) return false;
  return true;
}

function saveUpcomingFilters() {
  try { localStorage.setItem("wagrx-upcoming-filters", JSON.stringify({ ...upcomingFilters, dates: [] })); } catch (e) {}
}

function setUpcomingFilter(key, value) {
  upcomingFilters[key] = value;
  saveUpcomingFilters();
  renderUpcoming();
}

function clearUpcomingFilters() {
  for (const d of UPCOMING_FILTERS) if (d.key !== "sort") upcomingFilters[d.key] = d.def;
  for (const k of CHIP_KEYS) upcomingFilters[k] = [];
  upcomingFilters.best = false;
  upcomingFilters.win = false;
  upcomingQuery = "";
  saveUpcomingFilters();
  renderUpcoming();
}

// "Model picks as of <last full run>": picks, injuries and splits are rebuilt by the full runs, lines refresh every cycle.
function modelNote(games) {
  const times = games.map(g => g.model && g.model.updated).filter(Boolean).sort();
  return times.length ? ` Model picks as of ${fmtTime(times[times.length - 1])}; they can change before game time.` : " No model picks yet.";
}

function renderUpcoming() {
  const el = document.getElementById("upcoming");
  const sport = SPORTS.find(x => x.key === upcomingSport);
  const seg = `<div class="seg upcoming-seg" role="group" aria-label="Sport">${SPORTS.map(sp =>
    `<button class="range-btn${sp.key === upcomingSport ? " active" : ""}" onclick="selectUpcomingSport('${sp.key}')">${sp.label}</button>`).join("")}</div>`;
  const data = upcomingCache[upcomingSport];
  if (data === undefined) { el.innerHTML = seg + '<div class="empty-state">Loading&hellip;</div>'; return; }
  if (data === null) { el.innerHTML = seg + `<div class="empty-state">No upcoming ${sport.label} lines posted yet.</div>`; return; }

  const games = data.games || [];
  const header = `<div class="perf-updated">${sport.label}, next 7 days. Updated ${fmtTime(data.updated)}. Lines from ESPN (DraftKings).${modelNote(games)}</div>`;
  if (!games.length) {
    el.innerHTML = seg + header + `<div class="empty-state">No upcoming ${sport.label} games with lines yet.</div>`;
    return;
  }

  const hasKeyNumbers = (data.key_numbers || []).length > 0;
  // Dates that actually have games, with counts; a selected date that no longer has games is dropped.
  const dayCounts = {};
  for (const g of games) { const d = etDay(g.start); dayCounts[d] = (dayCounts[d] || 0) + 1; }
  const days = Object.keys(dayCounts).sort();
  upcomingFilters.dates = upcomingFilters.dates.filter(d => dayCounts[d]);
  const dateOpts = days.map(d => {
    const [y, m, dd] = d.split("-").map(Number);
    const label = new Date(y, m - 1, dd).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
    return [d, `${label} (${dayCounts[d]})`];
  });

  const kept = games.filter(g => passesUpcomingFilters(g, hasKeyNumbers));
  // Stable sorts: ties (and games with no value) stay in start order, no-value games last.
  const sortKey = { move: upcomingMoveSize, consensus: upcomingConfidence }[upcomingFilters.sort];
  if (sortKey) kept.sort((x, y) => (sortKey(y) ?? -1) - (sortKey(x) ?? -1));

  const defs = UPCOMING_FILTERS.filter(d => !d.needsKeyNumbers || hasKeyNumbers);
  upcomingTotal = games.length;
  upcomingFilterActive = CHIP_KEYS.some(k => upcomingFilters[k].length > 0) || (upcomingFilters.best && !!bestSelFor(upcomingSport)) || (upcomingFilters.win && winReady(upcomingSport))
    || defs.some(d => d.key !== "sort" && upcomingFilters[d.key] !== d.def);
  const search = `<div class="controls-row"><input type="search" id="upcoming-search" class="search-box" placeholder="Search teams&hellip;"`
    + ` value="${upcomingQuery.replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;")}" oninput="setUpcomingSearch(this.value)"></div>`;
  const bar = filterUiHtml("upcoming", defs, ["sort"], dateOpts, "upcoming-meta", "", true);

  let day = null, html = "";
  upcomingGames = [];
  kept.forEach((g, i) => {
    if (upcomingFilters.sort === "start") {  // day headings only make sense in kickoff order
      const label = etLabel(g.start, { weekday: "long", month: "short", day: "numeric" });
      if (label !== day) { day = label; html += `<div class="perf-sub">${label}</div>`; }
    }
    html += renderUpcomingGame(g, data.key_numbers || [], i);
  });
  el.innerHTML = seg + bestBannerHtml(upcomingSport) + header + search + bar
    + `<div id="upcoming-list">${html}</div><div class="empty-state" id="upcoming-nomatch" hidden>No games match.</div>`;
  applyUpcomingSearch();
}

function setUpcomingSearch(value) {
  upcomingQuery = value;
  applyUpcomingSearch();
}

// Hides the cards that do not match the search text (no re-render, so typing keeps focus), hides day
// headings left with no visible card, and updates the "Showing X of Y" note.
function applyUpcomingSearch() {
  const q = upcomingQuery.trim().toLowerCase();
  const list = document.getElementById("upcoming-list");
  if (!list) return;
  const cards = [...list.querySelectorAll(".game-card")];
  let visible = 0;
  for (const card of cards) {
    const match = !q || (card.dataset.search || "").includes(q);
    card.classList.toggle("hidden-by-search", !match);
    if (match) visible++;
  }
  for (const heading of list.querySelectorAll(".perf-sub")) {
    let anyVisible = false;
    for (let n = heading.nextElementSibling; n && !n.classList.contains("perf-sub"); n = n.nextElementSibling) {
      if (n.classList.contains("game-card") && !n.classList.contains("hidden-by-search")) { anyVisible = true; break; }
    }
    heading.hidden = !anyVisible;
  }
  document.getElementById("upcoming-nomatch").hidden = visible > 0;
  const active = upcomingFilterActive || q !== "";
  document.getElementById("upcoming-meta").innerHTML = active
    ? `<span>Showing ${visible} of ${upcomingTotal}</span><button class="filter-clear" onclick="clearUpcomingFilters()">Clear filters</button>` : "";
}

function loadUpcoming() {
  const key = upcomingSport;
  delete upcomingCache[key];  // always fetch fresh when the tab or sport is opened
  refreshBest(key);
  renderUpcoming();
  fetch(`${key}_upcoming.json?_=` + Date.now())
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(data => { upcomingCache[key] = data; })
    .catch(err => { upcomingCache[key] = null; console.error(err); })
    .finally(() => { if (key === upcomingSport && currentView === "upcoming") renderUpcoming(); });
}

// ---- History tab: one graded day at a time, per sport (from <sport>_history.json) ----
let historySport = null;
let historyData = null;
let historyDate = null;
let historyRuns = [];   // that day's saved runs (days/<sport>/<date>.json), if any
let historyRun = "graded";  // "graded" (each game's last run before kickoff) or an index into historyRuns
let historyGames = [];  // games currently rendered in History (for the detail dropdowns)
let historyQuery = "";  // team search text; kept across date/run/filter changes, reset when the sport changes
// Date scope. Untouched ("auto"): the latest day, but a search spans every graded day. Picking a date in the
// dropdown pins the view (and the search) to that day; picking "All dates" pins it to every day.
let historyDateExplicit = false;
let historyAllExplicit = false;
function historyScopeAll() { return historyAllExplicit || (!historyDateExplicit && historyQuery.trim() !== ""); }

function selectHistory() {
  currentView = "history";
  renderTabs();
  setViewVisibility();
  loadHistory(historySport || currentSport);
}

function historyDays() {
  const days = (historyData && historyData.days) || {};
  return Object.keys(days).filter(d => (days[d] || []).length).sort().reverse();
}

function fmtDate(d) {
  const [y, m, day] = d.split("-").map(Number);
  return new Date(y, m - 1, day).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric", year: "numeric" });
}

function loadHistory(key) {
  historySport = key;
  historyQuery = "";
  historyDateExplicit = false;
  historyAllExplicit = false;
  historyData = null;
  const sport = SPORTS.find(s => s.key === key);
  document.getElementById("history").innerHTML = '<div class="empty-state">Loading&hellip;</div>';
  fetch(sport.histFile + "?_=" + Date.now())
    .then(r => r.ok ? r.json() : null)
    .catch(() => null)
    .then(data => {
      historyData = data;
      const days = historyDays();
      if (!days.includes(historyDate)) historyDate = days[0] || null;
      loadHistoryRuns();
    });
}

function selectHistoryDate(d) {
  if (d === "all") {
    historyAllExplicit = true;
    historyDateExplicit = false;
    renderHistory();
    return;
  }
  historyAllExplicit = false;
  historyDateExplicit = true;
  historyDate = d;
  loadHistoryRuns();
}

function loadHistoryRuns() {
  historyRuns = [];
  historyRun = "graded";
  renderHistory();
  if (!historyDate) return;
  const sport = historySport, date = historyDate;
  fetch(`days/${sport}/${date}.json?_=` + Date.now())
    .then(r => r.ok ? r.json() : null)
    .catch(() => null)
    .then(data => {
      if (sport !== historySport || date !== historyDate) return;  // user moved on meanwhile
      historyRuns = (data && data.snapshots) || [];
      renderHistory();
    });
}

function selectHistoryRun(v) {
  historyRun = v === "graded" ? "graded" : parseInt(v, 10);
  renderHistory();
}

function resultTag(result) {
  if (result === "WIN") return '<span class="tag agree">WIN</span>';
  if (result === "LOSS") return '<span class="tag disagree">LOSS</span>';
  return "";
}

function renderHistoryGame(g, date = null) {
  const dateLabel = date ? (([y, m, d]) => new Date(y, m - 1, d).toLocaleDateString("en-US", { month: "short", day: "numeric" }))(date.split("-").map(Number)) + " &middot; " : "";
  const picks = g.picks || {};
  const c = picks.CONSENSUS || {};
  const modelRows = Object.entries(picks).filter(([k]) => k !== "CONSENSUS" && !isSharpKey(k)).map(([k, p]) =>
    `<tr><td>${k}</td><td>${p.pick || "N/A"}${resultTag(p.result)}</td></tr>`
  ).join("");
  const final = g.final ? ` &middot; Final: ${g.final}` : "";
  const votes = Object.entries(picks).filter(([k]) => k !== "CONSENSUS" && !isSharpKey(k))
    .map(([, p]) => [g.team_home, g.team_away].includes(p.pick) ? p.pick : null);
  const agreement = agreementHtml(votes, c.pick);
  const consensusLine = pickLineHtml(g.line, g.favorite, c.pick, [g.team_home, g.team_away]);
  const statusTag = g.status ? `<span class="tag neutral">${g.status.split(" (")[0]}</span>` : resultTag(c.result);
  const sharpGame = { ...g, detail: { "M6: Sharp Money": g.sharp || {} } };
  return `
    <div class="game-card" data-search="${(g.game || "").toLowerCase()}">
      <div class="game-header" onclick="toggleCard(this)">
        <div class="game-title-row" role="button" tabindex="0" aria-expanded="false">
          <div>
            <div class="game-title">${g.game || ""}</div>
            <div class="game-meta">${dateLabel}Line: ${g.line || "N/A"}${final}</div>
          </div>
          <span class="chevron">&#9654;</span>
        </div>
        <div class="consensus-row">
          <div>
            <div class="consensus-label">Consensus</div>
            <div class="consensus-pick">${c.pick || "N/A"}${consensusLine}${statusTag}</div>
          </div>
          <div class="conf-col"><div class="confidence-badge">${g.confidence || "N/A"}</div>${agreement}</div>
        </div>
        ${renderSharpRow(sharpGame, g.cover)}
        ${renderLineMoveHistory(g)}
      </div>
      <div class="models-wrap">
        <table class="models">${modelRows}</table>
      </div>
    </div>
  `;
}

function renderHistory() {
  const sport = SPORTS.find(s => s.key === historySport);
  const days = historyDays();
  const sportOpts = SPORTS.map(s => `<option value="${s.key}"${s.key === historySport ? " selected" : ""}>${s.label}</option>`).join("");
  const scopeAll = historyScopeAll();
  const dateOpts = days.length
    ? `<option value="all"${scopeAll ? " selected" : ""}>All dates</option>`
      + days.map(d => `<option value="${d}"${!scopeAll && d === historyDate ? " selected" : ""}>${fmtDate(d)}</option>`).join("")
    : "<option>No graded days</option>";
  const runOpts = `<option value="graded"${historyRun === "graded" ? " selected" : ""}>Graded</option>` + historyRuns.map((r, i) =>
    `<option value="${i}"${i === historyRun ? " selected" : ""}>${new Date(r.time).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" })}</option>`
  ).join("");
  const controls = `
    <div class="controls-row">
      <label class="field"><span class="field-label">Sport</span><select class="runtime-select" onchange="loadHistory(this.value)">${sportOpts}</select></label>
      <label class="field"><span class="field-label">Day</span><select class="runtime-select" onchange="selectHistoryDate(this.value)"${days.length ? "" : " disabled"}>${dateOpts}</select></label>
      ${historyRuns.length && !scopeAll ? `<label class="field"><span class="field-label">Run</span><select class="runtime-select" onchange="selectHistoryRun(this.value)">${runOpts}</select></label>` : ""}
      <input type="search" id="history-search" class="search-box" placeholder="Search teams&hellip;"
        value="${historyQuery.replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;")}" oninput="setHistorySearch(this.value)">
    </div>`;
  const container = document.getElementById("history");
  if (!days.length) {
    container.innerHTML = controls + `<div class="empty-state">No graded ${sport.label} games yet.</div>`;
    return;
  }
  const gradedGames = historyData.days[historyDate] || [];
  const run = historyRun === "graded" ? null : historyRuns[historyRun];

  // Build one item per game for the chosen view, then filter/sort them like the Games view.
  let items, results, note;
  if (scopeAll) {
    // Every graded day, newest first, as the simple graded cards (the per-run snapshots are per day).
    historyGames = [];
    items = [];
    results = [];
    for (const d of days) {
      for (const h of historyData.days[d] || []) {
        const res = ((h.picks || {}).CONSENSUS || {}).result || null;
        items.push({ fx: historyEntryFacts(h, res), html: () => renderHistoryGame(h, d) });
        results.push(res);
      }
    }
    note = `All ${days.length} graded days, newest first. Pick a date to narrow it to one day.`;
  } else if (historyRun === "graded" && historyRuns.length) {
    // Each game exactly as it looked in the run that was graded (its last run before
    // kickoff). Games graded from the morning file (no saved run) use the simple card.
    historyGames = [];
    items = gradedGames.map((h, order) => {
      const res = ((h.picks || {}).CONSENSUS || {}).result || null;
      const snap = h.graded_run && historyRuns.find(r => r.time === h.graded_run);
      const g = snap && (snap.games || []).find(x => x.team_home === h.team_home && x.team_away === h.team_away);
      if (!g) return { fx: historyEntryFacts(h, res), html: () => renderHistoryGame(h) };
      historyGames.push(g);
      const idx = historyGames.length - 1;
      return { fx: gameFacts(g, res), html: () => renderGame(g, idx,
        { cover: h.cover, final: h.final, status: h.status, run: h.graded_run }, "history") };
    });
    results = gradedGames.map(g => (g.picks && g.picks.CONSENSUS || {}).result);
    note = "Each game as of its last run before kickoff, which is what was graded.";
  } else if (!run) {
    // Days from before runs were saved only have the graded morning picks.
    historyGames = [];
    items = gradedGames.map(h => {
      const res = ((h.picks || {}).CONSENSUS || {}).result || null;
      return { fx: historyEntryFacts(h, res), html: () => renderHistoryGame(h) };
    });
    results = gradedGames.map(g => (g.picks && g.picks.CONSENSUS || {}).result);
    note = "Run-by-run snapshots weren't saved for this day, so this shows the graded morning picks.";
  } else {
    // A saved run: the exact cards the Games view showed at that time, plus the grade.
    historyGames = run.games || [];
    const grades = historyGames.map(g => {
      const h = gradedGames.find(x => x.team_home === g.team_home && x.team_away === g.team_away);
      return h ? { cover: h.cover, final: h.final, status: h.status } : { status: "Not graded" };
    });
    results = historyGames.map((g, i) => {
      const c = (g.picks || {}).CONSENSUS || "";
      if (!grades[i].cover || !c.startsWith("TAKE:")) return null;
      return c.replace("TAKE:", "").trim() === grades[i].cover ? "WIN" : "LOSS";
    });
    items = historyGames.map((g, i) => ({ fx: gameFacts(g, results[i]), html: () => renderGame(g, i, grades[i], "history") }));
    note = `Showing the ${fmtTime(run.time)} run, graded against final scores.`;
  }
  const shown = applyFilters(items, "history");
  container.innerHTML = controls + dayRecordBar(results, items.length, note)
    + renderFilterBar("history", shown.length, items.length)
    + `<div id="history-list">${shown.length ? shown.map(it => it.html()).join("") : '<div class="empty-state">No games match these filters.</div>'}</div>`
    + '<div class="empty-state" id="history-nomatch" hidden>No games match.</div>';
  applyHistorySearch();
}

function setHistorySearch(value) {
  const wasAll = historyScopeAll();
  historyQuery = value;
  if (wasAll !== historyScopeAll()) {  // the first/last character switches between one day and all days
    renderHistory();
    const el = document.getElementById("history-search");
    if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    return;
  }
  applyHistorySearch();
}

// Hides the cards that do not match the search text (no re-render, so typing keeps focus) and shows
// "X of N games" in the record bar while a search is active.
function applyHistorySearch() {
  const list = document.getElementById("history-list");
  if (!list) return;
  const q = historyQuery.trim().toLowerCase();
  const cards = [...list.querySelectorAll(".game-card")];
  let visible = 0;
  for (const card of cards) {
    const match = !q || (card.dataset.search || "").includes(q);
    card.classList.toggle("hidden-by-search", !match);
    if (match) visible++;
  }
  const nomatch = document.getElementById("history-nomatch");
  if (nomatch) nomatch.hidden = !(cards.length && q && visible === 0);
  const count = document.querySelector("#history .hist-count");
  if (count) {
    const total = parseInt(count.dataset.count, 10);
    count.textContent = q ? `${visible} of ${total} ${total === 1 ? "game" : "games"}` : `${total} ${total === 1 ? "game" : "games"}`;
  }
  // While searching, the consensus record is that of the matching games (read off their WIN/LOSS tags).
  const rec = document.querySelector("#history .hist-rec-line");
  if (rec) {
    let w = parseInt(rec.dataset.w, 10), l = parseInt(rec.dataset.l, 10);
    if (q) {
      w = l = 0;
      for (const card of cards) {
        if (card.classList.contains("hidden-by-search")) continue;
        const tags = [...card.querySelectorAll(".consensus-pick .tag")].map(x => x.textContent);  // FAV/DOG, then WIN/LOSS
        if (tags.includes("WIN")) w++; else if (tags.includes("LOSS")) l++;
      }
    }
    rec.innerHTML = `Consensus: <span class="hist-record">${w}-${l}</span>${w + l ? ` (${Math.round(w / (w + l) * 100)}%)` : ""}`;
  }
}

// Facts for a simple History entry (picks stored as { pick, result }, sharp as raw splits).
function historyEntryFacts(h, result) {
  const c = ((h.picks || {}).CONSENSUS || {}).pick;
  const lm = ((h.picks || {})[LINE_MOVE_KEY] || {}).pick;
  const g = { team_home: h.team_home, team_away: h.team_away, confidence: h.confidence,
              picks: { CONSENSUS: c && c !== "N/A" && c !== "SPLIT" && c !== "PUSH" ? "TAKE: " + c : "",
                       [LINE_MOVE_KEY]: lm && ![ "N/A", "SPLIT", "PUSH" ].includes(lm) ? "TAKE: " + lm : "" },
              detail: { "M6: Sharp Money": h.sharp || {} } };
  return gameFacts(g, result);
}

function dayRecordBar(results, count, note) {
  const w = results.filter(r => r === "WIN").length;
  const l = results.filter(r => r === "LOSS").length;
  const pct = w + l ? ` (${Math.round(w / (w + l) * 100)}%)` : "";
  return `
    <div class="status-bar">
      <span class="hist-rec-line" data-w="${w}" data-l="${l}">Consensus: <span class="hist-record">${w}-${l}</span>${pct}</span>
      <span class="hist-count" data-count="${count}">${count} ${count === 1 ? "game" : "games"}</span>
    </div>
    <div class="hist-note">${note}</div>`;
}

// ---- Manual refresh: asks the refresh service (a small Cloudflare Worker) to run this sport's dashboard refresh on
// the data PC. The service owns the daily allowance and each sport's status; the page only shows what it reports.
const REFRESH_API = "https://wagrx-refresh.sverma71098.workers.dev";
let refreshStatus = null;   // last /status payload, or null while the service is unreachable (the row stays hidden)
let refreshSkew = 0;        // service clock minus this device's clock, so progress timing ignores clock drift
let refreshTimer = null, refreshBusy = false, refreshLastCheck = 0, refreshAnimating = false;
const refreshChecking = {}, refreshSeen = {}, refreshDone = {}, refreshDoneAt = {};

const refreshActive = st => !!st && (st.state === "queued" || st.state === "running" || st.state === "published");

function refreshState(sportKey) {
  const st = refreshStatus && refreshStatus.sports && refreshStatus.sports[sportKey];
  if (!st) return { state: "idle" };
  const now = Date.now() + refreshSkew;
  if (st.state === "published" && (refreshDone[st.id] || now - st.doneAt > 10 * 60000)) return { ...st, state: "idle" };
  if ((st.state === "failed" || st.state === "expired") && now - st.endedAt > 10 * 60000) return { state: "idle" };
  return st;
}

function refreshProgress(st) {
  const now = Date.now() + refreshSkew;
  if (st.state === "queued") return { pct: 4 + 11 * (1 - Math.exp(-(now - st.requestedAt) / 30000)), text: "Waiting for the refresh service to pick this up" };
  if (st.state === "running") {
    const est = Math.max(30, st.avgSec || 60) * 1000;
    return { pct: 15 + 55 * (1 - Math.exp(-2 * (now - st.startedAt) / est)), text: "Pulling the latest sharp, line and injury data" };
  }
  return { pct: 70 + 28 * (1 - Math.exp(-(now - st.doneAt) / 40000)), text: "Publishing to the site, almost live" };
}

function renderRefresh() {
  const row = document.getElementById("refresh-row");
  if (!row) return;
  if (!refreshStatus || currentView !== "games") { row.style.display = "none"; return; }
  row.style.display = "";
  const sp = SPORTS.find(s => s.key === currentSport);
  const st = refreshState(currentSport);
  const active = refreshActive(st);
  // The allowance is per sport; `used` is {sport: n} (an older service sent one shared number).
  const usedNow = typeof refreshStatus.used === "object" ? (refreshStatus.used[currentSport] || 0) : refreshStatus.used;
  const left = Math.max(0, refreshStatus.limit - usedNow), atLimit = left <= 0;
  const justDone = refreshDoneAt[currentSport] && Date.now() - refreshDoneAt[currentSport] < 8000;
  let meta = atLimit
    ? `${sp.label} manual refresh limit reached (${refreshStatus.limit} of ${refreshStatus.limit} used today). Resets at midnight ET.`
    : `${left} of ${refreshStatus.limit} ${sp.label} manual refreshes left today`;
  if (st.state === "expired") meta = "The refresh service did not respond, so nothing was used. Try again later.";
  if (st.state === "failed") meta = "That refresh failed. The next scheduled run will still update the data.";
  const cls = atLimit || st.state === "expired" || st.state === "failed" ? " limit" : "";
  let prog = "";
  if (active) {
    const p = refreshProgress(st);
    prog = `<div class="refresh-prog"><div class="refresh-bar"><div class="refresh-track"><i style="width:${p.pct.toFixed(1)}%"></i></div></div><div class="refresh-stage">${p.text}</div></div>`;
  } else if (justDone) {
    prog = `<div class="refresh-prog done"><div class="refresh-bar"><div class="refresh-track"><i style="width:100%"></i></div>`
      + `<svg class="refresh-check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--win)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M8 12.5l3 3 5-6"/></svg></div>`
      + `<div class="refresh-stage">Done. ${sp.label} data is up to date.</div></div>`;
  }
  row.innerHTML = `<button type="button" class="refresh-btn" onclick="refreshNow()"${active || atLimit || refreshBusy ? " disabled" : ""}>`
    + `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>`
    + `Refresh ${sp.label}</button><span class="refresh-meta${cls}">${meta}</span>${prog}`;
  // Keep the bar moving between 3-second status checks.
  if (!refreshAnimating && SPORTS.some(s => refreshActive(refreshState(s.key)))) {
    refreshAnimating = true;
    const tick = () => {
      if (SPORTS.some(s => refreshActive(refreshState(s.key)))) { renderRefresh(); setTimeout(tick, 1000); }
      else refreshAnimating = false;
    };
    setTimeout(tick, 1000);
  }
}

// A published refresh is live once the deployed data file has a snapshot from after the refresh started.
function checkRefreshFresh() {
  if (Date.now() - refreshLastCheck < 8000) return;
  for (const sp of SPORTS) {
    const st = refreshState(sp.key);
    if (st.state !== "published" || refreshChecking[sp.key]) continue;
    refreshLastCheck = Date.now();
    refreshChecking[sp.key] = true;
    fetch(sp.file + "?_=" + Date.now()).then(r => r.json()).then(d => {
      const snaps = d.snapshots || [];
      const last = snaps.length ? Date.parse(snaps[snaps.length - 1].time) : 0;
      if (last >= st.startedAt - 15000) {
        refreshDone[st.id] = true;
        refreshDoneAt[sp.key] = Date.now();
        setTimeout(renderRefresh, 8500);
        if (refreshSeen[sp.key] === st.id && sp.key === currentSport && currentView === "games") loadSport(sp.key);
      }
    }).catch(() => {}).then(() => { refreshChecking[sp.key] = false; renderRefresh(); });
  }
}

function pollRefresh() {
  clearTimeout(refreshTimer);
  fetch(REFRESH_API + "/status", { cache: "no-store" })
    .then(r => r.ok ? r.json() : Promise.reject(new Error(r.status)))
    .then(s => {
      refreshStatus = s;
      refreshSkew = s.now - Date.now();
      for (const sp of SPORTS) { const st = refreshState(sp.key); if (refreshActive(st)) refreshSeen[sp.key] = st.id; }
    })
    .catch(() => { refreshStatus = null; })
    .then(() => {
      checkRefreshFresh();
      renderRefresh();
      if (refreshStatus && SPORTS.some(s => refreshActive(refreshState(s.key)))) refreshTimer = setTimeout(pollRefresh, 3000);
    });
}

function refreshNow() {
  if (refreshBusy) return;
  refreshBusy = true;
  renderRefresh();
  fetch(REFRESH_API + "/request", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ sport: currentSport }) })
    .catch(() => {})
    .then(() => { refreshBusy = false; pollRefresh(); });
}

(function init() {
  let saved = null;
  try { saved = localStorage.getItem("wagrx-last-sport"); } catch (e) {}
  if (saved && SPORTS.some(s => s.key === saved)) currentSport = saved;
  renderTabs();
  setViewVisibility();
  loadSport(currentSport);
  pollRefresh();
})();
</script>
</body>
</html>
